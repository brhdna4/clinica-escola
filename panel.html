<!DOCTYPE html>

<style>
  :focus-visible{ outline:2px solid var(--accent, #7c3aed); outline-offset:2px; border-radius:4px; }
  :root{
    --ink:#1e293b; --ink-soft:#475569; --ink-faint:#94a3b8;
    --hairline:rgba(15,23,42,.10); --hairline-strong:rgba(15,23,42,.18);
    --surface-1:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.8);
  }
  body[data-theme="neutro"]{
    --accent:#0d9488; --accent-soft:rgba(13,148,136,.12); --accent2:#6366f1;
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(14,165,233,.18), transparent 60%),
      radial-gradient(800px 600px at -10% 30%, rgba(99,102,241,.14), transparent 55%),
      linear-gradient(135deg,#f0f9ff 0%,#ffffff 40%,#eef2ff 100%);
  }
  body[data-theme="aurora"]{
    --accent:#7c3aed; --accent-soft:rgba(124,58,237,.12); --accent2:#0ea5e9;
    background:
      radial-gradient(900px 500px at 90% -10%, rgba(124,58,237,.20), transparent 60%),
      radial-gradient(800px 600px at -10% 30%, rgba(14,165,233,.18), transparent 55%),
      linear-gradient(135deg,#f5f3ff 0%,#ffffff 40%,#e0f2fe 100%);
  }
  *{ font-family:'Nunito', system-ui, sans-serif; }
  html,body{ min-height:100%; }
  body{ background-attachment:fixed; color:var(--ink); }
  .ink{ color:var(--ink); } .ink-soft{ color:var(--ink-soft); } .ink-faint{ color:var(--ink-faint); }
  .surface-1{ background:var(--surface-1); } .surface-2{ background:var(--surface-2); }
  .hairline{ border-color:var(--hairline); } .hairline-strong{ border-color:var(--hairline-strong); }

  .glass{
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 8px 30px rgba(15,23,42,.08);
  }
  .glass-strong{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 10px 34px rgba(15,23,42,.10);
  }
  .glass-input{
    background:rgba(255,255,255,.75);
    border:1px solid var(--hairline-strong);
    color:var(--ink);
    transition:all .25s ease;
  }
  .glass-input::placeholder{ color:var(--ink-faint); }
  .glass-input:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
    background:#fff;
  }
  .glass-input:disabled{ opacity:.5; cursor:not-allowed; }
  select.glass-input option{ background:#fff; color:var(--ink); }

  .btn{ transition:all .25s ease; display:inline-flex; align-items:center; gap:.45rem; font-weight:800; }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0) scale(.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 75%, #000)); color:#fff; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  .btn-accent2{ background:linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 75%, #000)); color:#fff; }
  .btn-ghost{ background:rgba(15,23,42,.05); border:1px solid var(--hairline-strong); color:var(--ink); }
  .btn-ghost:hover{ background:rgba(15,23,42,.1); }
  .btn-danger{ background:linear-gradient(135deg,#fb7185,#e11d48); color:#fff; }
  .btn-warn{ background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#1a1a1a; }

  .seg-btn{ transition:all .25s ease; color:var(--ink-soft); border:1px solid transparent; }
  .seg-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent); font-weight:900; }
  .seg-btn:not(.active):hover{ background:rgba(15,23,42,.06); color:var(--ink); }

  .tab-btn{ transition:all .25s ease; color:var(--ink-faint); border-bottom:2px solid transparent; font-weight:800; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .tab-btn:hover{ color:var(--ink); }

  .row-hover{ transition:background .2s ease; }
  .row-hover:hover{ background:rgba(15,23,42,.04); }

  .pill{ display:inline-flex; align-items:center; gap:.3rem; padding:.15rem .6rem; border-radius:999px; font-size:.7rem; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
  .pill-agendado{ background:rgba(59,130,246,.12); color:#1d4ed8; border:1px solid rgba(59,130,246,.35); }
  .pill-compareceu{ background:rgba(16,185,129,.14); color:#047857; border:1px solid rgba(16,185,129,.4); }
  .pill-falta{ background:rgba(245,158,11,.14); color:#b45309; border:1px solid rgba(245,158,11,.4); }
  .pill-desistiu{ background:rgba(225,29,72,.12); color:#be123c; border:1px solid rgba(225,29,72,.35); }
  .pill-pendente{ background:rgba(168,85,247,.12); color:#7e22ce; border:1px solid rgba(168,85,247,.35); }
  .pill-triagem{ background:rgba(14,165,233,.12); color:#0369a1; border:1px solid rgba(14,165,233,.35); }
  .pill-vinculado{ background:rgba(20,184,166,.14); color:#0f766e; border:1px solid rgba(20,184,166,.4); }
  .pill-sugerida{ background:rgba(249,115,22,.14); color:#c2410c; border:1px solid rgba(249,115,22,.4); }
  .pill-recusada{ background:rgba(100,116,139,.14); color:#475569; border:1px solid rgba(100,116,139,.35); }
  .pill-menor{ background:rgba(245,158,11,.14); color:#b45309; border:1px solid rgba(245,158,11,.4); }

  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .modal-in{ animation:modalIn .28s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes modalIn{ from{opacity:0; transform:scale(.92) translateY(10px);} to{opacity:1; transform:none;} }
  .toast-in{ animation:toastIn .3s ease both; }
  @keyframes toastIn{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;} }
  .pulse-alert{ animation:pulseAlert 1s ease infinite; }
  @keyframes pulseAlert{ 0%,100%{ box-shadow:0 0 0 0 rgba(225,29,72,.5);} 50%{ box-shadow:0 0 0 12px rgba(225,29,72,0);} }

  .slot-chip{ transition:all .2s ease; font-size:.7rem; font-weight:700; padding:.25rem .4rem; border-radius:.4rem; border:1px solid var(--hairline); background:rgba(255,255,255,.6); color:var(--ink-faint); cursor:pointer; }
  .slot-chip:hover{ border-color:var(--accent); color:var(--ink); }
  .slot-chip.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:900; }

  html, body{
    scrollbar-color: rgba(15,23,42,.18) transparent;
    scrollbar-width: thin;
  }
  /* Fallback para navegadores sem suporte a scrollbar-color/width */
  @supports not (scrollbar-color: auto) {
    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-thumb{ background:rgba(15,23,42,.18); border-radius:8px; }
    ::-webkit-scrollbar-track{ background:transparent; }
  }

  .conflict{ border-color:#e11d48!important; box-shadow:0 0 0 3px rgba(225,29,72,.18)!important; }
  .kpi-num{ font-variant-numeric:tabular-nums; }
  .timer-digits{ font-variant-numeric:tabular-nums; letter-spacing:.05em; }

  #printArea{ display:none; }
  @page{ size:A4; margin:10mm; }
  @media print{
    html,body{ background:#fff !important; }
    body * { visibility:hidden !important; }
    #printArea, #printArea * { visibility:visible !important; }
    #printArea{ display:block !important; position:absolute; left:0; top:0; width:100%; color:#000; background:#fff; padding:0; font-family:Arial, Helvetica, sans-serif; }
    #printArea h1{ font-size:16px; margin:0 0 2px; }
    #printArea h2{ font-size:12px; margin:10px 0 4px; }
    #printArea .sub{ font-size:10px; color:#333; margin-bottom:8px; }
    #printArea p{ font-size:10px; margin:4px 0; }
    #printArea table{ border-collapse:collapse; width:100%; table-layout:fixed; margin-bottom:6px; page-break-inside:auto; }
    #printArea tr{ page-break-inside:avoid; }
    #printArea th, #printArea td{ border:1px solid #333; padding:3px 5px; font-size:9.5px; text-align:left; word-break:break-word; overflow:hidden; vertical-align:top; }
    #printArea table.detalhe th, #printArea table.detalhe td{ font-size:8.5px; padding:2px 4px; }
    #printArea th{ background:#eee; font-weight:700; }
    .orbs, header, main, #toastRoot, #modalRoot{ display:none !important; }
  }
  /* NEON GLOW & POLISH */
  .neon-panel{
    background:linear-gradient(160deg, rgba(23,14,58,.93), rgba(8,10,32,.96));
    border:1px solid rgba(139,92,246,.4);
    box-shadow:0 0 0 1px rgba(34,211,238,.12), 0 12px 44px rgba(76,29,149,.4), inset 0 1px 0 rgba(255,255,255,.07);
    color:#e0e7ff;
  }
  .neon-panel .ink-faint, .neon-panel label{ color:#a5b4fc !important; }
  .neon-panel .ink{ color:#e0e7ff; }
  .neon-cyan{ color:#67e8f9 !important; text-shadow:0 0 12px rgba(34,211,238,.85), 0 0 34px rgba(34,211,238,.45); }
  .neon-text-purple{ color:#c4b5fd !important; text-shadow:0 0 14px rgba(167,139,250,.85); }
  .neon-title{ background:linear-gradient(90deg,#7c3aed,#0ea5e9,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .kpi-num{ text-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); }
  .seg-btn.active{ box-shadow:0 0 16px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); }
  .chart-card{ background:linear-gradient(160deg, rgba(15,10,40,.93), rgba(6,8,28,.97)); border:1px solid rgba(139,92,246,.32); border-radius:1rem; padding:1rem; box-shadow:0 0 34px rgba(76,29,149,.28); }
  .chart-card h4{ color:#c4b5fd; font-weight:900; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; margin:0 0 .6rem; text-shadow:0 0 10px rgba(167,139,250,.65); }
  .chart-card .chart-legend{ font-size:.7rem; color:#cbd5e1; font-weight:700; }
  .orbs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.3; animation:floatOrb 20s ease-in-out infinite; }
  .orb1{ width:440px; height:440px; background:#a78bfa; top:-140px; right:-90px; }
  .orb2{ width:400px; height:400px; background:#38bdf8; bottom:-160px; left:-110px; animation-delay:-10s; }
  @keyframes floatOrb{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(50px,-36px) scale(1.14);} }
  header, main, #printArea{ position:relative; z-index:1; }
  #modalRoot, #toastRoot{ position:fixed !important; }
  /* toasts precisam ficar acima do splash de login (z-index 200) */
  #toastRoot{ z-index:300 !important; }
  #modalRoot{ z-index:320 !important; }
  .glass{ transition:box-shadow .3s ease, transform .3s ease; }
  .glass:hover{ box-shadow:0 12px 40px rgba(76,29,149,.18); }
  /* THEME TOGGLE SWITCH */
  .theme-switch{ display:block; width:54px; height:28px; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); position:relative; box-shadow:0 0 14px color-mix(in srgb, var(--accent) 50%, transparent), inset 0 1px 3px rgba(0,0,0,.2); transition:all .3s; }
  .theme-switch .knob{ position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.35); transition:transform .35s cubic-bezier(.3,1.4,.5,1); display:flex; align-items:center; justify-content:center; }
  body[data-theme="aurora"] .theme-switch .knob{ transform:translateX(26px); }
  .theme-switch .knob::after{ content:''; width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  /* AURORA LIGHT PANEL (cronômetro) */
  .aurora-panel{
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(124,58,237,.35);
    box-shadow:0 0 0 1px rgba(14,165,233,.12), 0 12px 40px rgba(124,58,237,.22), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .neon-purple{ color:#7c3aed !important; text-shadow:0 0 14px rgba(124,58,237,.5), 0 0 34px rgba(124,58,237,.28); }
  /* WIZARD TYPEFORM */
  .wiz-step{ display:none; }
  .wiz-step.active{ display:block; animation:wizIn .35s ease both; }
  @keyframes wizIn{ from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:none;} }
  .wiz-dot{ width:8px; height:8px; border-radius:50%; background:rgba(15,23,42,.18); transition:all .3s; display:inline-block; }
  .wiz-dot.active{ background:var(--accent); width:22px; border-radius:999px; box-shadow:0 0 10px rgba(124,58,237,.5); }
  /* Pop-up de CEP do cadastro */
  .cep-overlay{ position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:1rem; background:rgba(15,23,42,.42); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); animation:cepFade .2s ease both; }
  @keyframes cepFade{ from{opacity:0;} to{opacity:1;} }
  .cep-modal{ width:100%; max-width:23rem; border-radius:1.25rem; padding:1.25rem; background:rgba(255,255,255,.97); border:1px solid rgba(255,255,255,.9); box-shadow:0 24px 60px rgba(15,23,42,.28); animation:modalIn .26s cubic-bezier(.2,.9,.3,1.2) both; }
  #mCepMsg{ min-height:1.05rem; }
  #mCepMsg.is-err{ color:#b91c1c; }
  #mCepMsg.is-ok{ color:#047857; }
  .flash-card{ animation:flashCard 1.6s ease; }
  @keyframes flashCard{ 0%,100%{ box-shadow:0 10px 34px rgba(15,23,42,.10); } 35%{ box-shadow:0 0 0 3px var(--accent-soft), 0 10px 34px color-mix(in srgb, var(--accent) 35%, transparent); } }
  /* SPLASH LOGIN — aurora premium */
  #splash{ position:fixed; inset:0; z-index:200; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:linear-gradient(135deg,#1e1b4b 0%,#312e81 35%,#1e3a8a 70%,#0c4a6e 100%); transition:opacity .8s ease; }
  #splash.splash-out{ opacity:0; pointer-events:none; }
  .splash-bg{ position:absolute; inset:0; }
  .splash-bg .orb{ position:absolute; border-radius:50%; filter:blur(80px); opacity:.55; animation:orbDrift 18s ease-in-out infinite; }
  .splash-bg .o1{ width:420px; height:420px; background:#7c3aed; top:-120px; left:-100px; }
  .splash-bg .o2{ width:380px; height:380px; background:#0ea5e9; bottom:-140px; right:-80px; animation-delay:-6s; }
  .splash-bg .o3{ width:300px; height:300px; background:#db2777; top:40%; left:60%; animation-delay:-12s; opacity:.4; }
  .splash-bg .o4{ width:260px; height:260px; background:#14b8a6; bottom:10%; left:8%; animation-delay:-3s; opacity:.35; }
  @keyframes orbDrift{ 0%,100%{ transform:translate(0,0) scale(1);} 33%{ transform:translate(60px,-40px) scale(1.15);} 66%{ transform:translate(-40px,50px) scale(.92);} }
  .splash-particles span{ position:absolute; bottom:-20px; width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); animation:rise linear infinite; }
  .splash-particles span:nth-child(1){ left:10%; animation-duration:11s; }
  .splash-particles span:nth-child(2){ left:25%; animation-duration:14s; width:4px; height:4px; animation-delay:-4s; }
  .splash-particles span:nth-child(3){ left:42%; animation-duration:9s; animation-delay:-2s; }
  .splash-particles span:nth-child(4){ left:58%; animation-duration:13s; width:5px; height:5px; animation-delay:-7s; }
  .splash-particles span:nth-child(5){ left:74%; animation-duration:10s; animation-delay:-1s; }
  .splash-particles span:nth-child(6){ left:88%; animation-duration:15s; width:4px; height:4px; animation-delay:-5s; }
  @keyframes rise{ from{ transform:translateY(0); opacity:0;} 10%{ opacity:.8;} to{ transform:translateY(-110vh); opacity:0;} }
  .splash-stage{ position:relative; z-index:2; text-align:center; max-width:380px; width:100%; animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(24px);} to{ opacity:1; transform:none;} }
  .logo-wrap{ position:relative; width:170px; height:170px; margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; }
  .logo-wrap .ring{ position:absolute; inset:0; border-radius:50%; border:2px solid rgba(167,139,250,.6); animation:ringPulse 2.6s ease-out infinite; }
  .logo-wrap .r2{ animation-delay:.85s; } .logo-wrap .r3{ animation-delay:1.7s; }
  @keyframes ringPulse{ 0%{ transform:scale(.7); opacity:.9;} 100%{ transform:scale(1.5); opacity:0;} }
  .logo-glass{ width:130px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.1); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.28); box-shadow:0 0 60px rgba(167,139,250,.55), inset 0 0 30px rgba(255,255,255,.15); animation:logoFloat 4s ease-in-out infinite; cursor:pointer; transition:transform .35s, box-shadow .35s; }
  .logo-wrap:hover .logo-glass{ transform:scale(1.08) rotate(-3deg); box-shadow:0 0 90px rgba(167,139,250,.85), inset 0 0 30px rgba(255,255,255,.22); }
  @keyframes logoFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  .splash-logo{ width:60px; height:auto; filter:invert(1) drop-shadow(0 0 18px rgba(255,255,255,.7)); }
  .splash-title{ font-size:1.35rem; font-weight:900; background:linear-gradient(90deg,#a78bfa,#22d3ee,#f0abfc,#a78bfa); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:gradShift 5s linear infinite; margin-bottom:.35rem; }
  @keyframes gradShift{ to{ background-position:300% 0; } }
  .splash-sub{ font-size:.72rem; font-weight:700; color:rgba(255,255,255,.65); margin-bottom:1.25rem; letter-spacing:.14em; text-transform:uppercase; }
  .splash-hint{ font-weight:800; font-size:.95rem; color:#e9d5ff; animation:hintGlow 2.2s ease-in-out infinite; margin-bottom:.75rem; }
  @keyframes hintGlow{ 0%,100%{ opacity:.7; text-shadow:0 0 8px rgba(167,139,250,.4);} 50%{ opacity:1; text-shadow:0 0 22px rgba(167,139,250,.95);} }
  .splash-arrow{ color:#c4b5fd; display:inline-block; animation:arrowBounce 1.4s ease-in-out infinite; }
  @keyframes arrowBounce{ 0%,100%{ transform:translateY(0); opacity:.6;} 50%{ transform:translateY(10px); opacity:1;} }
  .splash-card{ background:rgba(255,255,255,.1); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.25); border-radius:1.25rem; padding:1.75rem; box-shadow:0 20px 60px rgba(0,0,0,.4), 0 0 40px rgba(124,58,237,.35); text-align:left; position:relative; overflow:hidden; }
  .splash-card::before{ content:''; position:absolute; top:0; left:-100%; width:100%; height:2px; background:linear-gradient(90deg,transparent,#a78bfa,transparent); animation:cardShine 3s linear infinite; }
  @keyframes cardShine{ to{ left:100%; } }
  .splash-card h3{ font-weight:900; font-size:1.2rem; margin-bottom:.25rem; color:#fff; }
  .splash-card p.sub{ font-size:.72rem; font-weight:700; color:rgba(255,255,255,.6); margin-bottom:1rem; }
  .splash-input{ width:100%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:.75rem; padding:.7rem .95rem; font-size:.9rem; font-weight:700; margin-bottom:.75rem; color:#fff; transition:all .25s; }
  .splash-input::placeholder{ color:rgba(255,255,255,.5); }
  .splash-input:focus{ outline:none; border-color:#a78bfa; box-shadow:0 0 0 3px rgba(167,139,250,.3), 0 0 20px rgba(167,139,250,.45); background:rgba(255,255,255,.18); }

<script>
(function(){
  var lastNome = '';
  function forceAuth(){
    try{
      var bar=document.getElementById('authUserBar');
      var mail=document.getElementById('authUserEmail');
      if(!bar||!mail) return;
      var em = localStorage.getItem('clinicaAuthUser') || (window.__CLINICA_AUTH&&window.__CLINICA_AUTH.email)||'';
      if(!em){ bar.classList.add('hidden'); return; }
      bar.classList.remove('hidden'); bar.classList.add('flex');
      var nome='';
      try{
        var st = null;
        if(state && Array.isArray(state.usuarios)) st = state.usuarios;
        try {
          var cached = (window.ClinicaDB && typeof ClinicaDB.cache === 'function') ? ClinicaDB.cache() : null;
          if(!cached){ try { cached = JSON.parse(localStorage.getItem('clinicaPsicoDB_v2')||'{}'); } catch(e){ cached = null; } }
          if(cached && Array.isArray(cached.usuarios) && (!st || st.length < cached.usuarios.length)){ st = cached.usuarios; }
        } catch(e){}
        if(st && Array.isArray(st)){
      var eml = String(em).toLowerCase();
      var lp = eml.indexOf('@')>=0?eml.split('@')[0]:eml;
      if(eml === 'admin' || lp === 'admin'){
        var mAdmin = st.find(function(u){ return u && String(u.tipo||'').toLowerCase()==='admin'; });
        if(mAdmin && mAdmin.nome){ nome = String(mAdmin.nome).trim().split(/\s+/)[0]; }
        else { nome = 'Admin'; }
      }else{
        var m = st.find(function(u){ var ex=u.extra||{}; var ae=String(ex.authEmail||ex.email||'').toLowerCase(); return ae&&ae===eml; });
        if(!m) m = st.find(function(u){ var cands=[u.email,u.login,u.usuario,u.codigo].filter(Boolean).map(function(v){return String(v).toLowerCase();}); return cands.indexOf(eml)>=0||cands.indexOf(lp)>=0; });
        if(!m){
          for(var i=0;i<st.length;i++){ var uu=st[i]; if(uu && uu.nome && String(uu.nome).trim() && uu.tipo && String(uu.tipo).trim()){ m=uu; break; } }
        }
        if(m && m.nome){ nome = String(m.nome).trim().split(/\s+/)[0]; }
      }
        }
      }catch(e){}
      if(!nome){ var lp2 = em.indexOf('@')>=0?em.split('@')[0]:em; nome = lp2; }
      if(nome && nome !== lastNome){
        mail.textContent = nome;
        mail.innerText = nome;
        lastNome = nome;
      }else if(mail.textContent !== nome){
        mail.textContent = nome;
        mail.innerText = nome;
        lastNome = nome;
      }
    }catch(e){}
  }
  try{ forceAuth(); }catch(e){}
  try{ setTimeout(forceAuth, 500); }catch(e){}
  try{ setTimeout(forceAuth, 1000); }catch(e){}
})();
</script>

function emptyState(){
  return { terapeutas:[], salas:[], pacientes:[], solicitacoes:[], agendamentos:[], usoSalas:[], usuarios:[] };
}
function normalizeState(raw){
  if(!raw || typeof raw!=='object') return null;
  const s = Object.assign(emptyState(), raw);
  ['terapeutas','salas','pacientes','solicitacoes','agendamentos','usoSalas','usuarios'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  s.pacientes = s.pacientes.filter(p=>p && typeof p==='object');
  s.solicitacoes = s.solicitacoes.filter(x=>x && typeof x==='object');
  s.agendamentos = s.agendamentos.filter(x=>x && typeof x==='object');
  s.usoSalas = s.usoSalas.filter(x=>x && typeof x==='object');
  s.terapeutas = s.terapeutas.filter(x=>x && typeof x==='object');
  s.salas = s.salas.filter(x=>x && typeof x==='object');
  s.usuarios = s.usuarios.filter(x=>x && typeof x==='object');
  return s;
}

function confirmarModal(msg){

    const id = 'confirm_'+Date.now();
    const cancelId = 'cancel_'+Date.now();
    openModal('<div class="text-center"><h3 class="font-black text-lg mb-2">Confirmar</h3><p class="text-sm ink-soft font-bold mb-4">'+esc(msg)+'</p><div class="flex gap-2 justify-center"><button class="btn btn-ghost rounded-lg px-4 py-2 text-sm" id="'+cancelId+'">Cancelar</button><button class="btn btn-primary rounded-lg px-4 py-2 text-sm" id="'+id+'">Confirmar</button></div></div>');
    let resolvido = false;
    function fin(val){ if(resolvido) return; resolvido=true; try{ closeModal(); }catch(e){} resolve(val); }
    const btn = document.getElementById(id);
    const btnCancel = document.getElementById(cancelId);
    if(btn){ btn.onclick = function(){ fin(true); }; }
    if(btnCancel){ btnCancel.onclick = function(){ fin(false); }; }
    // backdrop
    const root = $('modalRoot');
    const handler = function(e){ if(e.target && e.target.id==='modalRoot'){ fin(false); root.removeEventListener('click', handler); } };
    root.addEventListener('click', handler);
  });
}

const timer = { running:false, endTs:0, remaining:0, total:0, pacienteId:null, salaId:null, interval:null };
function saveTimer(){
  try{
    if(!timer.running && timer.remaining<=0 && !timer.pacienteId && !timer.salaId){ localStorage.removeItem(TIMER_KEY); return; }
    localStorage.setItem(TIMER_KEY, JSON.stringify({running:timer.running,endTs:timer.endTs,remaining:timer.remaining,total:timer.total,pacienteId:timer.pacienteId,salaId:timer.salaId}));
  }catch(e){}
}
function loadTimer(){
  try{
    const raw=localStorage.getItem(TIMER_KEY); if(!raw) return;
    const t=JSON.parse(raw); if(!t) return;
    timer.total=Number(t.total)||0; timer.remaining=Number(t.remaining)||0; timer.pacienteId=t.pacienteId||null; timer.salaId=t.salaId||null;
    if(t.running && Number(t.endTs)>Date.now()){
      timer.running=true; timer.endTs=Number(t.endTs); timer.remaining=timer.endTs-Date.now();
      if(!timer.interval) timer.interval=setInterval(timerTick,250);
    } else if(t.running){ timer.running=false; timer.remaining=0; }
  }catch(e){}
}
function beep(){ try{ const C=window.AudioContext||window.webkitAudioContext; const ctx=new C(); [0,.18,.36].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.0001, ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+t+.15); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.16); }); }catch(e){} }
function fmtMs(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(s/60), ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
function refreshTimerDisplay(){
  const d=$('timerDigits'); if(!d) return;
  const rem = timer.running ? Math.max(0, timer.endTs - Date.now()) : timer.remaining;
  d.textContent = fmtMs(rem);
  updateTimerRing(rem);
  const info=$('timerInfo'); if(info){ info.textContent = timer.pacienteId ? `${pacienteNome(timer.pacienteId)} · ${salaNome(timer.salaId||'')}` : 'Nenhum atendimento selecionado'; }
  const btnStart=$('btnStartTimer'), btnPause=$('btnPauseTimer');
  if(btnStart){ const sp=btnStart.querySelector('span'); if(sp) sp.textContent = timer.running ? '' : (timer.remaining>0 && timer.remaining<timer.total ? 'Retomar' : 'Iniciar'); }
  if(btnPause) btnPause.style.display = timer.running ? '' : 'none';
}

function updateTimerRing(rem){
  if(!window.d3 || !document.getElementById('timerRingSvg')) return;

    const y = d3.scaleLinear().domain([0, Math.max(1, d3.max(hours))]).range([H-m.b, m.t]).nice();
    const areaGrad = svg.append('defs').append('linearGradient').attr('id','areaGrad').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1');
    areaGrad.append('stop').attr('offset','0%').attr('stop-color',NEON.purple).attr('stop-opacity',.45);
    areaGrad.append('stop').attr('offset','100%').attr('stop-color',NEON.cyan).attr('stop-opacity',0);
    svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(days.map((ds,i)=>i%2===0?fmtDate(ds):null).filter(Boolean))).selectAll('text').style('font-size','10px').style('fill','#94a3b8').style('font-weight','700');
    svg.selectAll('.domain,.tick line').attr('stroke','rgba(148,163,184,.2)');
    svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSize(-(W-m.l-m.r))).selectAll('text').style('font-size','10px').style('fill','#94a3b8').style('font-weight','700');
    svg.selectAll('.tick line').attr('stroke','rgba(148,163,184,.1)');
    const pts = days.map((ds,i)=>({x:fmtDate(ds), y:hours[i]}));
    const line = d3.line().x(d=>x(d.x)).y(d=>y(d.y)).curve(d3.curveMonotoneX);
    const area = d3.area().x(d=>x(d.x)).y0(H-m.b).y1(d=>y(d.y)).curve(d3.curveMonotoneX);
    svg.append('path').datum(pts).attr('fill','url(#areaGrad)').attr('d', area);
    const path = svg.append('path').datum(pts).attr('fill','none').attr('stroke',NEON.cyan).attr('stroke-width',2.5).attr('filter','url(#gLine)').attr('d', line);
    const len = path.node().getTotalLength();
    path.attr('stroke-dasharray', len).attr('stroke-dashoffset', len).transition().duration(1400).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0);
    svg.selectAll('circle.dot').data(pts).enter().append('circle').attr('class','dot').attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y)).attr('r',3).attr('fill',NEON.magenta).attr('filter','url(#gLine)')
      .style('opacity',0).transition().delay(1200).style('opacity',1);
  }
}
function timerTick(){
  if(!timer.running) return;
  const rem = timer.endTs - Date.now();
  if(rem<=0){ finishTimer(); return; }
  refreshTimerDisplay();
}
function finishTimer(){
  timer.running=false; timer.remaining=0; clearInterval(timer.interval); timer.interval=null; saveTimer();
  beep();
  timerAlertActive = true;
  let alt=false;
  titleFlashId = setInterval(()=>{ alt=!alt; document.title = alt ? `TEMPO ESGOTADO: ${pacienteNome(timer.pacienteId)}` : originalTitle; }, 800);
  openModal(`
    <div class="text-center">

}

/* ================= CONFLITOS DE AGENDA ================= */
function horaMin(h){ const m=String(h||'').match(/^(\d{2}):(\d{2})$/); return m ? (Number(m[1])*60 + Number(m[2])) : null; }
function intervaloSobrepoe(inicioA, durA, inicioB, durB){
  const a=horaMin(inicioA), b=horaMin(inicioB);
  if(a==null || b==null) return false;
  return a < b + (Number(durB)||30) && b < a + (Number(durA)||30);
}
function conflitoSalaIntervalo(salaId, data, hora, duracaoMin, excluirId){
  if(!salaId) return null;
  const dur=Number(duracaoMin)||30;
  const c = state.agendamentos.find(a=>a.salaId===salaId && a.data===data && a.id!==excluirId && a.status!=='desistiu' && intervaloSobrepoe(hora, dur, a.hora, 30));
  if(c) return `${salaNome(salaId)} já reservado em ${fmtDate(data)} às ${c.hora} (${pacienteNome(c.pacienteId)}).`;
  const u = state.usoSalas.find(x=>x.salaId===salaId && x.data===data && x.id!==excluirId && intervaloSobrepoe(hora, dur, x.horaInicio, Number(x.duracaoMin)||50));
  if(u) return `${salaNome(salaId)} já em uso em ${fmtDate(data)} às ${u.horaInicio}.`;
  return null;
}
function conflitoSala(salaId, data, hora, excluirId){ return conflitoSalaIntervalo(salaId, data, hora, 30, excluirId); }
/* Consultórios e profissionais ativos — usados por toda a checagem de disponibilidade */
function salasAtivas(){ return (state.salas||[]).filter(s=>s && s.ativa!==false); }
function salaAtiva(id){ return salasAtivas().some(s=>s.id===id); }
function temSalaLivre(data, hora, duracaoMin){
  const todas=(state.salas||[]);
  if(!todas.length) return true;
  const ativas=salasAtivas();
  if(!ativas.length) return false;
  const dur=Number(duracaoMin)||30;
  return ativas.some(s=>!conflitoSalaIntervalo(s.id, data, hora, dur, null));
}
function terapeutaAtivo(id){ const t=state.terapeutas.find(x=>x.id===id); return !!(t && t.ativo!==false); }
/* Desistência: libera imediatamente as reservas futuras e encerra pedidos abertos do paciente */
function cancelarReservasFuturas(pacienteId){
  const hoje=todayISO();
  (state.agendamentos||[]).forEach(a=>{ if(a.pacienteId===pacienteId && a.status==='agendado' && String(a.data)>=hoje) a.status='desistiu'; });
  (state.solicitacoes||[]).forEach(s=>{ if(s.pacienteId===pacienteId && ['pendente','sugerida'].includes(s.status)) s.status='recusada'; });
}
function marcarDesistenciaPaciente(pacienteId){
  const p=state.pacientes.find(x=>x.id===pacienteId); if(!p) return;
  p.status='desistiu';
  cancelarReservasFuturas(pacienteId);
}
function conflitoTerapeuta(terapeutaId, data, hora, excluirId, duracaoMin){
  if(!terapeutaId) return null;
  const dur=Number(duracaoMin)||30;
  const c = state.agendamentos.find(a=>a.terapeutaId===terapeutaId && a.data===data && a.id!==excluirId && a.status!=='desistiu' && intervaloSobrepoe(hora, dur, a.hora, 30));
  if(c) return `${terapeutaNome(terapeutaId)} já tem atendimento em ${fmtDate(data)} às ${c.hora} (${pacienteNome(c.pacienteId)}).`;
  const u = state.usoSalas.find(x=>x.alunoId===terapeutaId && x.data===data && x.id!==excluirId && intervaloSobrepoe(hora, dur, x.horaInicio, Number(x.duracaoMin)||50));
  if(u) return `${terapeutaNome(terapeutaId)} já registrou uso de consultório em ${fmtDate(data)} às ${u.horaInicio}.`;
  return null;
}
function conflitoPaciente(pacienteId, data, hora, excluirId){
  if(!pacienteId) return null;
  const c = state.agendamentos.find(a=>a.pacienteId===pacienteId && a.data===data && a.hora===hora && a.id!==excluirId && a.status!=='desistiu');
  return c ? `Paciente já tem atendimento em ${fmtDate(data)} às ${hora}.` : null;
}
function conflitoUsoSala(salaId, data, hora, duracaoMin, excluirId){
  if(!salaId) return null;
  const dur=Number(duracaoMin)||50;
  const u = state.usoSalas.find(x=>x.salaId===salaId && x.data===data && x.id!==excluirId && intervaloSobrepoe(hora, dur, x.horaInicio, Number(x.duracaoMin)||50));
  return u ? `${salaNome(salaId)} já tem uso registrado em ${fmtDate(data)} às ${u.horaInicio}.` : null;
}

  }

  if(session.alunoTab==='presenca'){
    html += `<div class="space-y-3"><p class="text-xs ink-faint font-bold flex items-center gap-1.5">${icon('info','w-3.5 h-3.5')} Substitui as 20 colunas de sessão do CSV — marque a presença de cada atendimento confirmado.</p>${!meusAg.length?`<div class="glass rounded-xl p-8 text-center ink-faint">${icon('calendar-check','w-8 h-8 mx-auto mb-2 opacity-60')}<p class="font-bold">Nenhum atendimento confirmado.</p></div>`:''}`;

      html += `<div class="glass rounded-xl p-4 flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[180px]"><p class="font-bold ink">${esc(p.nome)}</p><p class="text-xs ink-soft font-bold">${fmtDate(a.data)} (${weekdayName(a.data)}) às ${a.hora} · ${esc(salaNome(a.salaId))}</p></div>${statusPill(a.status)}${a.status==='agendado'?`<div class="flex flex-wrap gap-2 w-full sm:w-auto"><button class="btn btn-primary rounded-lg px-3 py-1.5 text-xs" data-action="presenca" data-id="${a.id}" data-status="compareceu">${icon('check','w-3.5 h-3.5')} Compareceu</button><button class="btn btn-warn rounded-lg px-3 py-1.5 text-xs" data-action="presenca" data-id="${a.id}" data-status="falta_justificada">${icon('clock','w-3.5 h-3.5')} Falta Justif.</button><button class="btn btn-danger rounded-lg px-3 py-1.5 text-xs" data-action="presenca" data-id="${a.id}" data-status="desistiu">${icon('user-x','w-3.5 h-3.5')} Desistência</button></div>`:''}</div>`;

  if(session.alunoTab==='usosala'){
    html += usoSalaForm(t.id) + `<div class="glass rounded-xl p-4 mt-4"><h3 class="font-black text-sm mb-3 ink flex items-center gap-2">${icon('history','w-4 h-4')} Meus registros de uso (${meusUsos.length})</h3><div class="space-y-2 max-h-72 overflow-y-auto">${meusUsos.length?meusUsos.map(u=>`<div class="rounded-lg surface-1 p-3 text-xs border hairline flex justify-between items-center gap-2"><div><span class="font-bold ink">${fmtDate(u.data)} · ${u.horaInicio} · ${u.duracaoMin}min</span><br><span class="ink-soft">${esc(salaNome(u.salaId))}${u.pacienteId?` · ${esc(pacienteNome(u.pacienteId))}`:''}</span>${u.nota?`<br><span class="ink-faint italic">${esc(u.nota)}</span>`:''}</div><button class="text-xs font-bold text-rose-600 hover:text-rose-800 transition" data-action="delUso" data-id="${u.id}">excluir</button></div>`).join(''):`<p class="text-sm ink-faint">Nenhum registro.</p>`}</div></div>`;
  }

  if(session.alunoTab==='disponibilidade'){
    const daysIdx=[1,2,3,4,5,6];
    html += `<div class="glass rounded-xl p-4"><p class="text-xs ink-faint font-bold mb-3 flex items-center gap-1.5">${icon('info','w-3.5 h-3.5')} Clique nos horários para definir sua disponibilidade. Pacientes só verão os ativos.</p><div class="overflow-x-auto"><table class="w-full text-xs border-collapse"><thead><tr>${daysIdx.map(d=>`<th class="px-2 py-2 font-black ink border-b hairline">${DAYS_SHORT[d]}</th>`).join('')}</tr></thead><tbody><tr>${daysIdx.map(d=>`<td class="px-1 py-2 align-top border-r hairline last:border-0"><div class="flex flex-col gap-1 min-w-[70px]">${SLOTS.map(h=>{ const on=(t.disponibilidade[d]||[]).includes(h); return `<button class="slot-chip ${on?'on':''}" data-action="toggleSlot" data-dia="${d}" data-hora="${h}">${h}</button>`; }).join('')}</div></td>`).join('')}</tr></tbody></table></div></div>`;
  }
  return html + `</div>`;
}

function usoSalaForm(alunoId, opts={}){
  const isRecepcao = (alunoId === 'recepcao') || opts.recepcao === true;
  const pacienteObrigatorio = opts.pacienteObrigatorio === true && !isRecepcao;
  const permiteLivre = opts.permiteLivre !== undefined ? opts.permiteLivre : true;
  const responsavelObrigatorio = isRecepcao || opts.responsavelObrigatorio === true;
  const terapeutasOpts = (state.terapeutas||[]).filter(t=>t.ativo!==false).map(t=>`<option value="${esc(t.id)}">${esc(t.nome)}${t.tipo?` (${esc(t.tipo)})`:''}</option>`).join('');
  return `<div class="glass-strong rounded-xl p-4">
    <h3 class="font-black text-sm mb-3 flex items-center gap-2" style="color:var(--accent2)">${icon('door-open','w-4 h-4')} Registrar Uso de Consultório</h3>
    <div class="grid sm:grid-cols-3 lg:grid-cols-7 gap-2 items-end">
      <div><label class="text-[11px] font-black ink-faint block mb-1">Consultório *</label><select id="uso_sala" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold">${state.salas.filter(x=>x.ativa).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
      <div><label class="text-[11px] font-black ink-faint block mb-1">Dia *</label><input type="date" id="uso_data" value="${todayISO()}" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold"></div>
      <div><label class="text-[11px] font-black ink-faint block mb-1">Horário início *</label><select id="uso_hora" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold">${SLOTS.map(h=>`<option>${h}</option>`).join('')}</select></div>
      <div><label class="text-[11px] font-black ink-faint block mb-1">Duração (min) *</label><select id="uso_dur" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold">${DURACOES.map(m=>`<option ${m===50?'selected':''}>${m}</option>`).join('')}</select></div>
      ${isRecepcao?`<div><label class="text-[11px] font-black ink-faint block mb-1">Responsável (Aluno/Professor) <span class="text-rose-600">*</span></label><select id="uso_responsavel" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold"><option value="">— selecione —</option>${terapeutasOpts}</select></div>`:`<div><label class="text-[11px] font-black ink-faint block mb-1">Paciente ${pacienteObrigatorio?'<span class="text-rose-600">*</span>':''}</label><select id="uso_paciente" class="glass-input rounded-lg px-2 py-2 text-xs w-full font-bold">${permiteLivre?`<option value="">— nenhum (uso livre) —</option>`:''}${state.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>`}
      <button class="btn btn-primary rounded-lg px-3 py-2 text-xs justify-center" data-action="addUsoSala" data-aluno="${isRecepcao?'recepcao':(alunoId||'recepcao')}" data-recepcao="${isRecepcao?'1':'0'}">${icon('check','w-3.5 h-3.5')} Registrar</button>
    </div>
    <input id="uso_nota" class="glass-input rounded-lg px-3 py-2 text-xs w-full font-bold mt-2" placeholder="Nota opcional (ex: observação, supervisão, uso livre...)">
  </div>`;
}

/* ================= RENDER: RECEPÇÃO ================= */
function renderRecepcao(){
  const hoje = todayISO();

  if(!session.recepcaoFiltroTerapeuta) session.recepcaoFiltroTerapeuta = '';
  let agendaBase = (state.agendamentos||[]).filter(a=>a.status!=='desistiu');
  if(session.recepcaoFiltroData === 'hoje') agendaBase = agendaBase.filter(a=>a.data===hoje);
  else if(session.recepcaoFiltroData === 'amanha'){ const am = new Date(hoje+'T00:00:00'); am.setDate(am.getDate()+1); agendaBase = agendaBase.filter(a=>a.data===am.toISOString().slice(0,10)); }

      <div class="flex-1"></div>

        <button class="seg-btn px-2 py-1 text-xs ${session.recepcaoFiltroData==='amanha'?'active':''}" data-action="filtroAgendaRecepcao" data-tipo="amanha">Amanhã</button>
        <button class="seg-btn px-2 py-1 text-xs ${session.recepcaoFiltroData==='semana'?'active':''}" data-action="filtroAgendaRecepcao" data-tipo="semana">Esta semana</button>
        <button class="seg-btn px-2 py-1 text-xs ${session.recepcaoFiltroData==='todos'?'active':''}" data-action="filtroAgendaRecepcao" data-tipo="todos">Todos</button>
      </div>
      <select class="glass-input rounded-lg px-2 py-1.5 text-xs font-bold" data-action="filtroAgendaTerapeuta">
        <option value="" ${session.recepcaoFiltroTerapeuta===''?'selected':''}>Todos terapeutas</option>
        ${(state.terapeutas||[]).filter(t=>t.ativo!==false).map(t=>`<option value="${esc(t.id)}" ${session.recepcaoFiltroTerapeuta===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}
      </select>
      <button class="btn btn-ghost rounded-lg px-3 py-2 text-xs" data-action="irParaHoje">${icon('calendar','w-3.5 h-3.5')} Ir para hoje</button>
      <button class="btn btn-ghost rounded-lg px-3 py-2 text-xs" data-action="exportarAgendaHojePDF">${icon('download','w-3.5 h-3.5')} Agenda do dia em PDF</button>
      <span class="pill pill-agendado">${agendaHoje.length} atendimento(s) hoje</span>
    </div>

    <div class="glass rounded-2xl p-5">
      <div class="flex flex-wrap items-center gap-2 mb-3"><h3 class="font-black text-base ink flex items-center gap-2">${icon('calendar-check','w-5 h-5')} Agenda filtrada (${agendaLista.length})</h3><div class="flex-1"></div><button class="btn btn-ghost rounded-lg px-3 py-1.5 text-xs" data-action="exportarAgendaFiltrada">${icon('download','w-3.5 h-3.5')} Exportar PDF</button></div>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-left"><tr class="ink-faint"><th class="px-2 py-2">Data</th><th class="px-2 py-2">Hora</th><th class="px-2 py-2">Paciente</th><th class="px-2 py-2">Terapeuta</th><th class="px-2 py-2">Consultório</th><th class="px-2 py-2">Status</th><th class="px-2 py-2 text-right">Ações</th></tr></thead><tbody class="divide-y hairline">${agendaLista.length?agendaLista.map(a=>{ const p=state.pacientes.find(x=>x.id===a.pacienteId)||{}; const t=state.terapeutas.find(x=>x.id===a.terapeutaId)||{}; const s=state.salas.find(x=>x.id===a.salaId)||{}; let df=a.data||''; try{ if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(df)){ const [y,m,d]=df.split('-'); df=d+'/'+m+'/'+y; }}catch(e){} return `<tr><td class="px-2 py-2 font-bold">${df}</td><td class="px-2 py-2">${a.hora||''}</td><td class="px-2 py-2"><button class="font-bold text-left hover:underline" data-action="historicoPaciente" data-id="${p.id||''}">${esc(p.nome||'')}</button></td><td class="px-2 py-2">${esc(t.nome||'—')}</td><td class="px-2 py-2">${esc(s.nome||'—')}</td><td class="px-2 py-2">${statusPill(a.status)}</td><td class="px-2 py-2 text-right"><div class="flex flex-wrap justify-end gap-1"><button class="text-[11px] px-2 py-1 rounded-md font-black" style="background:rgba(34,197,94,.16);color:#065f46" data-action="presencaRapida" data-id="${a.id}" data-status="compareceu">Presença</button><button class="text-[11px] px-2 py-1 rounded-md font-black" style="background:rgba(251,191,36,.18);color:#92400e" data-action="presencaRapida" data-id="${a.id}" data-status="falta_justificada">Falta just.</button><button class="text-[11px] px-2 py-1 rounded-md font-black" style="background:rgba(239,68,68,.14);color:#991b1b" data-action="presencaRapida" data-id="${a.id}" data-status="desistiu">Desistiu</button></div></td></tr>`; }).join(''):`<tr><td colspan="7" class="px-2 py-6 text-center ink-faint">Nenhum agendamento para este filtro.</td></tr>`}</tbody></table></div>
    </div>

    <div class="aurora-panel rounded-2xl p-5">
      <h3 class="font-black text-base mb-4 flex items-center gap-2 neon-text-purple">${icon('timer','w-5 h-5')} Cronômetro de Atendimento</h3>
      <div class="grid md:grid-cols-3 gap-4 items-center">
        <div class="md:col-span-1 text-center">
          <div class="relative w-52 h-52 mx-auto flex items-center justify-center">
            <svg id="timerRingSvg" width="208" height="208" viewBox="0 0 208 208" class="absolute inset-0"></svg>
            <div id="timerDigits" class="timer-digits neon-purple text-3xl font-black relative z-10">00:00</div>
          </div>
          <p id="timerInfo" class="text-xs ink-faint font-bold mt-2">Nenhum atendimento selecionado</p>
          <div class="flex gap-2 justify-center mt-3">
            <button id="btnStartTimer" class="btn btn-primary rounded-lg px-4 py-2 text-sm" data-action="startTimer">${icon('play','w-4 h-4')}<span>Iniciar</span></button>
            <button id="btnPauseTimer" class="btn btn-warn rounded-lg px-4 py-2 text-sm" style="display:none" data-action="pauseTimer">${icon('pause','w-4 h-4')} Pausar</button>
            <button class="btn btn-ghost rounded-lg px-4 py-2 text-sm" data-action="resetTimer">${icon('rotate-ccw','w-4 h-4')} Zerar</button>
          </div>
        </div>
        <div class="md:col-span-2 grid sm:grid-cols-3 gap-3">
          <div><label class="text-xs font-black ink-faint block mb-1">Paciente</label><select id="tm_paciente" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold"><option value="">— selecione —</option>${state.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
          <div><label class="text-xs font-black ink-faint block mb-1">Consultório</label><select id="tm_sala" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.salas.filter(x=>x.ativa).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
          <div><label class="text-xs font-black ink-faint block mb-1">Duração (min)</label>
            <select id="tm_dur" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${DURACOES.map(m=>`<option ${m===50?'selected':''}>${m}</option>`).join('')}</select>
            <div class="flex flex-wrap gap-1 mt-2">${[25,30,45,50,60].map(m=>`<button class="text-[10px] font-black px-2 py-1 rounded-md surface-1 border hairline hover:border-purple-400 transition" data-action="setDur" data-min="${m}">${m}m</button>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="glass rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b hairline flex items-center gap-2"><h3 class="font-black text-sm ink">${icon('calendar','w-4 h-4')} Agenda de Hoje</h3><div class="flex-1"></div><span class="text-xs ink-faint font-bold">check-in pela recepção</span></div>
      <div class="divide-y hairline">${agendaHoje.length?agendaHoje.map(a=>{ const p=state.pacientes.find(x=>x.id===a.pacienteId)||{nome:'Paciente removido',idade:'—',prontuario:''}; return `<div class="px-4 py-3 flex flex-wrap items-center gap-3 row-hover">
        <span class="font-black text-lg ink kpi-num w-14">${a.hora}</span>
        <div class="flex-1 min-w-[160px]"><p class="font-bold ink">${esc(p.nome)} <span class="text-xs ink-faint">· ${p.idade}a</span></p><p class="text-xs ink-soft font-bold">${esc(terapeutaNome(a.terapeutaId))} · ${esc(salaNome(a.salaId))}</p></div>
        ${statusPill(a.status)}
        ${a.status==='agendado'?`<div class="flex gap-2"><button class="btn btn-primary rounded-lg px-3 py-1.5 text-xs" data-action="presenca" data-id="${a.id}" data-status="compareceu">${icon('check','w-3.5 h-3.5')} Presente</button><button class="btn btn-warn rounded-lg px-3 py-1.5 text-xs" data-action="presenca" data-id="${a.id}" data-status="falta_justificada">${icon('x','w-3.5 h-3.5')} Faltou</button></div>`:''}
      </div>`; }).join(''):`<div class="px-4 py-10 text-center ink-faint">${icon('calendar-x','w-8 h-8 mx-auto mb-2 opacity-60')}<p class="font-bold">Nenhum atendimento agendado para hoje.</p></div>`}</div>

        <div class="flex-1"></div>
        <span class="text-xs ink-faint font-bold">Mostrando hoje e próximos</span>
      </div>
      <div class="space-y-2 max-h-80 overflow-y-auto">
        ${(state.usoSalas||[]).filter(u=>u.data >= hoje).sort((a,b)=>(a.data+a.horaInicio).localeCompare(b.data+b.horaInicio)).slice(0,40).map(u=>{ const sala=state.salas.find(x=>x.id===u.salaId); const resp = state.terapeutas.find(x=>x.id===u.alunoId); const respNome = resp?resp.nome:(u.alunoId==='recepcao'?'Recepção':(terapeutaNome(u.alunoId)||u.alunoId)); const respInfo = resp?`${resp.cpf?`CPF: ${resp.cpf}`:''}${resp.telefone?` · Tel: ${resp.telefone}`:''}`:''; const pac = u.pacienteId?state.pacientes.find(x=>x.id===u.pacienteId):null; return `<div class="rounded-lg surface-1 p-3 text-xs border hairline flex flex-wrap items-center justify-between gap-2"><div class="min-w-[240px]"><p class="font-black ink">${fmtDate(u.data)} · ${u.horaInicio} · ${u.duracaoMin}min</p><p class="ink-soft font-bold">${esc(sala?sala.nome:'Consultório')} · ${esc(respNome)} ${respInfo?`<span class="ink-faint">(${respInfo})</span>`:''}</p>${pac?`<p class="ink-soft">Paciente: ${esc(pac.nome)}</p>`:`<p class="ink-faint">Uso livre (sem paciente)</p>`}${u.nota?`<p class="ink-faint italic mt-1">${esc(u.nota)}</p>`:''}</div><button class="text-xs font-bold text-rose-600 hover:text-rose-800 transition" data-action="delUso" data-id="${u.id}">Cancelar reserva</button></div>`; }).join('') || `<p class="text-sm ink-faint">Nenhum uso agendado a partir de hoje.</p>`}
      </div>
    </div>

    <div class="glass rounded-xl p-4"><h3 class="font-black text-sm mb-3 ink flex items-center gap-2">${icon('door-open','w-4 h-4')} Ocupação dos consultórios hoje</h3>
      <div class="grid sm:grid-cols-3 gap-3">${state.salas.filter(s=>s.ativa).map(s=>{ const oc=agendaHoje.filter(a=>a.salaId===s.id); const us=state.usoSalas.filter(u=>u.data===hoje && u.salaId===s.id); const linhas=oc.map(a=>({h:a.hora,t:esc(pacienteNome(a.pacienteId).split(' ')[0])+' ('+statusPill(a.status)+')'})).concat(us.map(u=>({h:u.horaInicio,t:esc(u.pacienteId?pacienteNome(u.pacienteId):terapeutaNome(u.alunoId))+' — uso livre '+u.duracaoMin+'min'}))).sort((a,b)=>a.h.localeCompare(b.h)); return `<div class="rounded-xl surface-1 border hairline p-3"><p class="font-black text-sm ink mb-2">${esc(s.nome)}</p>${linhas.length?linhas.map(l=>`<p class="text-xs ink-soft font-bold py-0.5">${l.h} · ${l.t}</p>`).join(''):`<p class="text-xs ink-faint">Livre o dia todo.</p>`}</div>`; }).join('')}</div>
    </div>
  </div>`;
  return html;
}

/* ================= RENDER: PROFESSORES ================= */
function renderProfessor(){
  const professores = (state.terapeutas||[]).filter(t=>t.tipo==='professor' || t.tipo==='docente' || /prof/i.test(t.nome) || /prof/i.test(t.cargo||'') || t.role==='professor').slice();
  if(professores.length===0){
    // também incluir usuarios com tipo professor
    (state.usuarios||[]).forEach(u=>{
      if((u.tipo==='professor'||u.tipo==='docente') && !professores.find(p=>p.id===u.terapeutaId || p.usuarioId===u.id)){
        const t = state.terapeutas.find(x=>x.id===u.terapeutaId) || {id:u.terapeutaId||uid(), nome:u.nome, tipo:u.tipo};
        professores.push({...t, usuarioId:u.id});
      }
    });
  }
  const alunos = (state.terapeutas||[]).filter(t=>t.tipo==='aluno' || (!t.tipo && (t.semestre||t.turma||t.professor)));
  let html = `<div class="fade-in space-y-5">
    <div class="glass rounded-2xl p-5 flex flex-wrap items-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--accent-soft)">${icon('book-open','w-5 h-5')}</div>
      <div><h2 class="font-black text-lg ink">Professores</h2><p class="text-xs ink-faint font-bold">Gestão de professores, turmas, semestres e vínculo com alunos/estagiários.</p></div>
      <div class="flex-1"></div><button class="btn btn-primary rounded-lg px-4 py-2 text-sm" data-action="novoProfessor">${icon('user-plus','w-4 h-4')} Cadastrar professor</button><span class="pill pill-vinculado">${professores.length} professor(es)</span><span class="pill pill-agendado">${alunos.length} aluno(s)/estagiário(s)</span>
    </div>

    <div class="glass rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b hairline flex items-center gap-2"><h3 class="font-black text-sm ink">${icon('users','w-4 h-4')} Professores cadastrados</h3><div class="flex-1"></div></div>
      <div class="divide-y hairline">${professores.length?professores.map(p=>{ const vinc = alunos.filter(a=>(a.professorId===p.id)||(a.professor===p.nome)); return `<div class="px-4 py-3"><div class="flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[200px]"><p class="font-bold ink">${esc(p.nome)}</p><p class="text-xs ink-faint font-bold">${p.cpf?`CPF: ${esc(p.cpf)}`:''}${p.telefone?` · Tel: ${esc(p.telefone)}`:''}${p.email?` · ${esc(p.email)}`:''}</p></div><span class="text-xs ink-soft font-bold">${vinc.length} aluno(s) vinculado(s)</span></div>${vinc.length?`<div class="mt-2 flex flex-wrap gap-2">${vinc.map(a=>`<span class="text-[11px] px-2 py-1 rounded-lg surface-1 border hairline">${esc(a.nome)}${a.turma?` · Turma: ${esc(a.turma)}`:''}${a.semestre?` · ${esc(a.semestre)}`:''}</span>`).join('')}</div>`:''}<div class="mt-2"><label class="text-[11px] font-black ink-faint block mb-1">Vincular aluno/estagiário</label><div class="flex flex-wrap gap-2 items-center"><select id="vinc_aluno_${p.id}" class="glass-input rounded-lg px-2 py-1.5 text-xs font-bold min-w-[220px]">${alunos.filter(a=>!(a.professorId===p.id)).map(a=>`<option value="${a.id}">${esc(a.nome)}${a.turma?` (${esc(a.turma)})`:''}</option>`).join('')}</select><input id="vinc_turma_${p.id}" class="glass-input rounded-lg px-2 py-1.5 text-xs font-bold" placeholder="Turma (opcional)"><input id="vinc_sem_${p.id}" class="glass-input rounded-lg px-2 py-1.5 text-xs font-bold" placeholder="Período/Semestre (opcional)"><button class="btn btn-primary rounded-lg px-3 py-1.5 text-xs" data-action="vincularAlunoProf" data-prof="${p.id}">${icon('link','w-3.5 h-3.5')} Vincular</button></div></div></div>`; }).join(''):`<div class="px-4 py-8 text-center ink-faint">Nenhum professor cadastrado. Cadastre usuários do tipo Professor no Admin.</div>`}
      </div>
    </div>

    <div class="glass rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b hairline flex items-center gap-2"><h3 class="font-black text-sm ink">${icon('graduation-cap','w-4 h-4')} Alunos/Estagiários</h3><div class="flex-1"></div></div>
      <div class="divide-y hairline">${alunos.length?alunos.map(a=>{ const prof = professores.find(p=>p.id===a.professorId) || (a.professor?{nome:a.professor}:null); return `<div class="px-4 py-3 flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[200px]"><p class="font-bold ink">${esc(a.nome)}</p><p class="text-xs ink-faint font-bold">${a.turma?`Turma: ${esc(a.turma)}`:''}${a.semestre?` · ${esc(a.semestre)}`:''}${prof?` · Prof.: ${esc(prof.nome)}`:' · Sem professor vinculado'}</p></div>${prof?`<button class="text-xs font-bold text-rose-600 hover:text-rose-800 transition" data-action="desvincularAlunoProf" data-aluno="${a.id}">Desvincular</button>`:`<button class="text-xs font-bold text-sky-700 hover:text-sky-900 transition" data-action="abrirVinculoAluno" data-aluno="${a.id}">Vincular a professor</button>`}</div>`; }).join(''):`<div class="px-4 py-6 text-center ink-faint">Nenhum aluno/estagiário encontrado.</div>`}
      </div>
    </div>
  </div>`;
  return html;
}

/* ================= RENDER: ADMIN ================= */
function renderAdmin(){
  const total=state.pacientes.length, ag=state.pacientes.filter(p=>p.status==='agendado').length, des=state.pacientes.filter(p=>p.status==='desistiu').length, tri=(state.pacientes.filter(p=>p.status==='triagem'&&!p.terapeutaId).length + state.solicitacoes.filter(s=>!s.terapeutaId&&s.status==='pendente'&&!state.pacientes.some(p=>p.id===s.pacienteId&&p.status==='triagem'&&!p.terapeutaId)).length);
  const hoje = todayISO();
  const comp = (state.agendamentos||[]).filter(a=>a.data===hoje && a.status==='compareceu').length;
  const falt = (state.agendamentos||[]).filter(a=>a.data===hoje && a.status==='falta_justificada').length;
  const canc = (state.agendamentos||[]).filter(a=>a.data===hoje && a.status==='desistiu').length;
  const tabs=[['dashboard','Dashboard'],['geral','Lista Geral'],['triagem','Triagem'],['salas','Consultórios'],['relatorio','Relatório Mensal'],['usuarios','Usuários'],['dados','Backup e Dados']];
  const now=new Date();
  let html=`<div class="fade-in space-y-5">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
      ${[['users',total,'Pacientes cadastrados','text-emerald-700 bg-emerald-100'],['calendar-check',ag,'Com agendamento','text-sky-700 bg-sky-100'],['user-x',des,'Desistências','text-rose-700 bg-rose-100'],['inbox',tri,'Na triagem','text-purple-700 bg-purple-100'],['check-circle',comp,'Compareceram hoje','text-emerald-700 bg-emerald-100'],['alert-triangle',falt+canc,'Faltas/Cancelados hoje','text-amber-700 bg-amber-100']].map(([ic,num,label,cls])=>`<button class="glass rounded-xl p-4 flex items-center gap-3 text-left hover:shadow-lg transition" ${label==='Na triagem'?"data-action=\"setAdminTab\" data-tab=\"triagem\"":(label.indexOf('agendamento')>=0?"data-action=\"setView\" data-view=\"recepcao\"":'')}><div class="w-10 h-10 rounded-xl ${cls} flex items-center justify-center">${icon(ic,'w-5 h-5')}</div><div><p class="kpi-num text-2xl font-black ink">${num}</p><p class="text-[11px] ink-faint font-black leading-tight">${label}</p></div></button>`).join('')}
    </div>
    <div class="flex flex-wrap items-center gap-1 border-b hairline">${tabs.map(([k,label])=>`<button class="tab-btn ${session.adminTab===k?'active':''} px-4 py-2 text-sm" data-action="setAdminTab" data-tab="${k}">${label}</button>`).join('')}<div class="flex-1"></div><button class="btn btn-ghost rounded-lg px-3 py-1.5 text-xs mb-1" data-action="resetDemo">${icon('refresh-cw','w-3.5 h-3.5')} Restaurar demo</button></div>`;

  if(session.adminTab==='dashboard'){ html += renderDashboard(); }
  if(session.adminTab==='usuarios'){ html += renderUsuarios(); }
  if(session.adminTab==='dados'){ html += renderDados(); }
  if(session.adminTab==='geral'){
    html += `<div class="glass rounded-xl p-4 mb-3 flex flex-wrap gap-3 items-center"><div class="relative flex-1 min-w-[200px]">${icon('search','w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 ink-faint')}<input id="adminSearch" class="glass-input rounded-lg pl-9 pr-3 py-2 text-sm w-full font-bold" placeholder="Buscar nome, prontuário ou telefone..."></div><select id="adminFiltro" class="glass-input rounded-lg px-3 py-2 text-sm font-bold"><option value="">Todos status</option><option value="agendado">Agendado</option><option value="desistiu">Desistiu</option><option value="triagem">Em triagem</option><option value="vinculado">Vinculado</option></select><select id="adminFiltroTerapeuta" class="glass-input rounded-lg px-3 py-2 text-sm font-bold"><option value="">Todos terapeutas</option>${(state.terapeutas||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('')}</select><button class="btn btn-ghost rounded-lg px-3 py-2 text-xs" data-action="exportarPacientesPDF">${icon('download','w-3.5 h-3.5')} Exportar PDF</button></div>
    <div class="glass rounded-xl overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="surface-2 text-xs uppercase tracking-wide ink-soft"><tr><th class="text-left px-4 py-3">Idade</th><th class="text-left px-4 py-3">Nome</th><th class="text-left px-4 py-3">Prontuário</th><th class="text-left px-4 py-3">Telefone</th><th class="text-left px-4 py-3">Terapeuta</th><th class="text-left px-4 py-3">Dia/Horário Fixo</th><th class="text-left px-4 py-3">Status</th></tr></thead><tbody id="adminTbody"></tbody></table></div></div>`;
  }

  if(session.adminTab==='triagem'){
    const pend=state.solicitacoes.filter(s=>!s.terapeutaId&&s.status==='pendente');
    const pendIds=new Set(pend.map(s=>s.pacienteId));
    const semAluno=state.pacientes.filter(p=>p.status==='triagem' && !p.terapeutaId && !pendIds.has(p.id)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
    const total=semAluno.length+pend.length;
    html += `<div class="space-y-3">${!total?`<div class="glass rounded-xl p-8 text-center ink-faint">${icon('inbox','w-8 h-8 mx-auto mb-2 opacity-60')}<p class="font-bold">Fila de triagem vazia.</p></div>`:''}`;
    if(semAluno.length){
      html += `<h4 class="font-black text-sm ink flex items-center gap-2">${icon('user-search','w-4 h-4')} Pacientes aguardando aluno (${semAluno.length})</h4>`;
      html += `<p class="text-xs ink-faint font-bold">Cadastrados sem vínculo com aluno. Escolha o responsável — o paciente passa a aparecer em "Meus Pacientes" dele.</p>`;
      semAluno.forEach(p=>{
        const dias = diasDesde(p.criadoEm||p.extra&&p.extra.criadoEm);
        const alerta = dias>=3 ? 'style="border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08)"' : '';
        html += `<div class="glass rounded-xl p-4" ${alerta}><div class="flex flex-wrap items-center gap-3 mb-3"><div class="flex-1 min-w-[180px]"><p class="font-bold ink">${esc(p.nome)} ${p.idade<18?menorPill():''} <span class="text-xs ink-faint">· ${p.idade}a · ${esc(p.telefone)}</span>${dias>=1?`<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 font-black ml-1">${dias} dia(s) na triagem</span>`:''}</p><p class="text-xs ink-soft font-bold">${p.prontuario?'Prontuário '+esc(p.prontuario)+' · ':''}${p.email?esc(p.email):'Sem e-mail'} · ${p.idade<18?'Responsável: '+esc((p.responsavel||{}).nome||'não informado'):'Maior de idade'}</p></div>${statusPill('triagem')}</div>
        <div class="grid sm:grid-cols-3 gap-2 items-end"><div class="sm:col-span-2"><label class="text-[11px] font-black ink-faint block mb-1">Atribuir aluno / terapeuta</label><select id="tri_pac_${p.id}" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold"><option value="">Selecione…</option>${state.terapeutas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><button class="btn btn-primary rounded-lg px-4 py-2 text-sm justify-center" data-action="atribuirAluno" data-id="${p.id}">${icon('check','w-4 h-4')} Atribuir aluno</button></div></div>`;
      });
    }
    if(pend.length){
      html += `<h4 class="font-black text-sm ink flex items-center gap-2">${icon('inbox','w-4 h-4')} Solicitações aguardando triagem (${pend.length})</h4>`;
      html += `<p class="text-xs ink-faint font-bold">Pedidos de horário de pacientes sem aluno definido — ao aprovar, o vínculo é criado e o primeiro atendimento entra na agenda.</p>`;
      pend.forEach(s=>{ const p=state.pacientes.find(x=>x.id===s.pacienteId)||{nome:'Paciente removido',idade:'—',prontuario:'',telefone:'—'};
        const dias = diasDesde(s.criadoEm);
        const alerta = dias>=3 ? 'style="border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08)"' : '';
        html += `<div class="glass rounded-xl p-4" ${alerta}><div class="flex flex-wrap items-center gap-3 mb-3"><div class="flex-1 min-w-[180px]"><p class="font-bold ink">${esc(p.nome)} <span class="text-xs ink-faint">· ${p.idade}a · ${esc(p.telefone)}</span>${dias>=1?`<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 font-black ml-1">${dias} dia(s) na triagem</span>`:''}</p><p class="text-xs ink-soft font-bold">Solicitou: ${fmtDate(s.data)} (${weekdayName(s.data)}) às ${s.hora}</p></div>${statusPill('triagem')}</div>
      <div class="grid sm:grid-cols-3 gap-2 items-end"><div><label class="text-[11px] font-black ink-faint block mb-1">Atribuir terapeuta</label><select id="tri_terapeuta_${s.id}" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.terapeutas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div><label class="text-[11px] font-black ink-faint block mb-1">Consultório</label><select id="tri_sala_${s.id}" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.salas.filter(x=>x.ativa).map(sa=>`<option value="${sa.id}">${esc(sa.nome)}</option>`).join('')}</select></div><button class="btn btn-primary rounded-lg px-4 py-2 text-sm justify-center" data-action="aprovarTriagem" data-id="${s.id}">${icon('check','w-4 h-4')} Aprovar e agendar</button></div></div>`;
      });
    }
    html += `</div>`;
  }

  if(session.adminTab==='salas'){
    const reservas=state.agendamentos.filter(a=>a.status!=='desistiu').sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    html += `<div class="grid md:grid-cols-2 gap-4"><div class="glass rounded-xl p-4"><h3 class="font-black text-sm mb-3 flex items-center gap-2" style="color:var(--accent2)">${icon('door-open','w-4 h-4')} Consultórios</h3>
      <div class="flex gap-2"><input id="novaSala" class="glass-input rounded-lg px-3 py-2 text-sm flex-1 font-bold" placeholder="Ex: Consultório 3, Consultório de Observação..." maxlength="60"><button class="btn btn-accent2 rounded-lg px-4 py-2 text-sm" data-action="addSala">${icon('plus','w-4 h-4')} Adicionar</button></div>
      <div class="mt-4 space-y-2">${state.salas.map(s=>`<div class="rounded-lg surface-1 px-3 py-2 border hairline text-sm"><div class="flex items-center justify-between gap-2"><span class="font-bold ink flex items-center gap-2">${icon('door-open','w-4 h-4')} ${esc(s.nome)}${!s.ativa?'<span class="pill pill-recusada">inativo</span>':''}</span><span class="text-[11px] font-bold ink-faint">${(state.agendamentos.filter(a=>a.salaId===s.id).length + state.usoSalas.filter(u=>u.salaId===s.id).length)} registro(s)</span></div><div class="flex flex-wrap gap-3 mt-1.5"><button class="text-xs font-black text-sky-700 hover:text-sky-900 transition" data-action="editarSala" data-id="${s.id}">Alterar</button><button class="text-xs font-black ${s.ativa?'text-amber-700 hover:text-amber-900':'text-emerald-700 hover:text-emerald-900'} transition" data-action="toggleSala" data-id="${s.id}">${s.ativa?'Desativar':'Reativar'}</button><button class="text-xs font-black text-rose-600 hover:text-rose-800 transition" data-action="excluirSala" data-id="${s.id}">Excluir</button></div></div>`).join('') || '<p class="text-sm ink-faint">Nenhum consultório cadastrado.</p>'}</div></div>
    <div class="glass rounded-xl p-4"><h3 class="font-black text-sm mb-3 flex items-center gap-2 text-sky-700">${icon('calendar-check','w-4 h-4')} Reservas Confirmadas</h3><div class="space-y-2 max-h-80 overflow-y-auto pr-1">${reservas.length?reservas.map(a=>`<div class="rounded-lg surface-1 p-3 text-xs border hairline flex justify-between items-center gap-2"><div><span class="font-black" style="color:var(--accent2)">${esc(salaNome(a.salaId))}</span><br><span class="ink-soft">${fmtDate(a.data)} · ${a.hora} · ${esc(pacienteNome(a.pacienteId))}</span></div>${statusPill(a.status)}</div>`).join(''):`<p class="text-sm ink-faint">Nenhuma reserva.</p>`}</div><p class="text-[11px] ink-faint mt-3 font-bold flex items-center gap-1.5">${icon('shield','w-3.5 h-3.5')} Bloqueio automático de duas consultas na mesmo consultório/dia/horário.</p></div></div>
    <div class="glass rounded-xl p-4 mt-4"><h3 class="font-black text-sm mb-3 flex items-center gap-2 text-emerald-700">${icon('plus','w-4 h-4')} Reserva Manual de Consultório</h3><div class="grid sm:grid-cols-5 gap-2 items-end"><div><label class="text-[11px] font-black ink-faint block mb-1">Consultório</label><select id="rs_sala" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.salas.filter(x=>x.ativa).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div><div><label class="text-[11px] font-black ink-faint block mb-1">Paciente</label><select id="rs_paciente" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div><div><label class="text-[11px] font-black ink-faint block mb-1">Terapeuta</label><select id="rs_terapeuta" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${state.terapeutas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div><label class="text-[11px] font-black ink-faint block mb-1">Dia</label><input type="date" id="rs_data" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold"></div><div><label class="text-[11px] font-black ink-faint block mb-1">Hora</label><select id="rs_hora" class="glass-input rounded-lg px-3 py-2 text-sm w-full font-bold">${SLOTS.map(h=>`<option>${h}</option>`).join('')}</select></div></div><button class="btn btn-primary rounded-lg px-4 py-2 text-sm mt-3" data-action="reservaManual">${icon('check','w-4 h-4')} Confirmar reserva</button></div>`;
  }

  if(session.adminTab==='relatorio'){
    html += `<div class="glass rounded-xl p-4"><h3 class="font-black text-sm mb-3 flex items-center gap-2" style="color:var(--accent)">${icon('file-text','w-4 h-4')} Relatório Mensal de Uso de Consultórios</h3>
      <div class="flex flex-wrap gap-3 items-end mb-4">
        <div><label class="text-[11px] font-black ink-faint block mb-1">Mês</label><select id="rel_mes" class="glass-input rounded-lg px-3 py-2 text-sm font-bold">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===now.getMonth()+1?'selected':''}>${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][m-1]}</option>`).join('')}</select></div>
        <div><label class="text-[11px] font-black ink-faint block mb-1">Ano</label><select id="rel_ano" class="glass-input rounded-lg px-3 py-2 text-sm font-bold">${[now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1].map(y=>`<option ${y===now.getFullYear()?'selected':''}>${y}</option>`).join('')}</select></div>
        <button class="btn btn-primary rounded-lg px-4 py-2 text-sm" data-action="gerarRelatorio">${icon('bar-chart-2','w-4 h-4')} Gerar relatório</button>
        <div><label class="text-[11px] font-black ink-faint block mb-1">Tipo de relatório</label><select id="rel_tipo" onchange="var w=document.getElementById('rel_paciente_wrap'); if(w){ w.classList.toggle('hidden', this.value!=='ficha'); }" class="glass-input rounded-lg px-3 py-2 text-sm font-bold"><option value="geral">Uso de atendimento / consultas</option><option value="ficha">Ficha do paciente (modelo PDF)</option></select></div>
        <div id="rel_paciente_wrap" class="hidden"><label class="text-[11px] font-black ink-faint block mb-1">Paciente</label><select id="rel_paciente" class="glass-input rounded-lg px-3 py-2 text-sm font-bold">${state.pacientes.length?state.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join(''):'<option value="">Nenhum paciente cadastrado</option>'}</select></div>
        <button class="btn btn-primary rounded-lg px-4 py-2 text-sm" data-action="gerarRelatorio">${icon('bar-chart-2','w-4 h-4')} Gerar relatório</button>
        <button class="btn btn-accent2 rounded-lg px-4 py-2 text-sm" data-action="imprimirRelatorio">${icon('printer','w-4 h-4')} Imprimir / PDF</button>
      </div>
      <div id="relatorioBox" class="text-sm ink-soft font-bold">Selecione o mês/ano e clique em Gerar relatório.</div>
    </div>`;
  }
  return html + `</div>`;
}

/* ================= RELATÓRIO ================= */
let ultimoRel = null;
function gerarFichaHTML(pacienteId){
  const p=state.pacientes.find(x=>x.id===pacienteId); if(!p) return '<p style="font-family:Arial">Paciente não encontrado.</p>';
  const e=p.endereco||{}; const r=p.responsavel;
