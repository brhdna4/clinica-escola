function gerarRelatorioHTML(mes, ano){
  const pad = n => String(n).padStart(2,'0');
  const prefixo = `${ano}-${pad(mes)}`;
  const usos = state.usoSalas.filter(u=>u.data && u.data.startsWith(prefixo)).sort((a,b)=>(a.data+a.horaInicio).localeCompare(b.data+b.horaInicio));
  const byAluno={}, bySala={}; let totalMin=0;
  usos.forEach(u=>{ totalMin+=u.duracaoMin; byAluno[u.alunoId]=(byAluno[u.alunoId]||0)+u.duracaoMin; bySala[u.salaId]=(bySala[u.salaId]||0)+u.duracaoMin; });
  const nomeMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes-1];
  let html = `<h1>Relatório de Uso de Consultórios — ${nomeMes}/${ano}</h1><p class="sub">Clínica-Escola de Psicologia · Anhanguera · Controle interno</p>`;
  html += `<p><b>Total:</b> ${usos.length} registro(s) · ${fmtMin(totalMin)} de uso.</p>`;
  html += `<h2>Por Aluno/Terapeuta</h2><table><tr><th>Aluno</th><th>Horas acumuladas</th></tr>${Object.entries(byAluno).sort((a,b)=>b[1]-a[1]).map(([id,m])=>{ const t=state.terapeutas.find(x=>x.id===id); const nome = t?t.nome:(id==='recepcao'?'Recepção/Outro':'—'); return `<tr><td>${esc(nome)}${t?'':' (sem vínculo)'}${t&&t.cpf?`<br><span style="font-size:9px;color:#444">CPF: ${esc(t.cpf)}</span>`:''}${t&&t.telefone?`<br><span style="font-size:9px;color:#444">Tel: ${esc(t.telefone)}</span>`:''}</td><td>${fmtMin(m)}</td></tr>`; }).join('')||'<tr><td colspan="2">—</td></tr>'}</table>`;
  html += `<h2>Por Consultório</h2><table><tr><th>Consultório</th><th>Horas acumuladas</th></tr>${Object.entries(bySala).sort((a,b)=>b[1]-a[1]).map(([id,m])=>`<tr><td>${esc(salaNome(id))}</td><td>${fmtMin(m)}</td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>'}</table>`;
  html += `<h2>Detalhamento (Uso Livre / Uso Vinculado)</h2><table class="detalhe"><colgroup><col style="width:8%"><col style="width:8%"><col style="width:7%"><col style="width:14%"><col style="width:20%"><col style="width:17%"><col style="width:26%"></colgroup><tr><th>Data</th><th>Horário</th><th>Duração</th><th>Consultório</th><th>Aluno/Terapeuta (cadastro)</th><th>Paciente</th><th>Tipo / Nota</th></tr>${usos.map(u=>{ const t=state.terapeutas.find(x=>x.id===u.alunoId); const alunoNome = t?t.nome:(u.alunoId==='recepcao'?'Recepção/Outro':(terapeutaNome(u.alunoId)||u.alunoId||'—')); const alunoInfo = t?`<br><span style="font-size:8.5px;color:#333">${t.cpf?`CPF: ${esc(t.cpf)} · `:''}${t.telefone?`Tel: ${esc(t.telefone)}`:''}</span>`:''; const tipo = u.pacienteId?'Vinculado ao paciente':'Uso livre'; return `<tr><td>${fmtDate(u.data)}</td><td>${u.horaInicio}</td><td>${u.duracaoMin}min</td><td>${esc(salaNome(u.salaId))}</td><td>${esc(alunoNome)}${alunoInfo}</td><td>${u.pacienteId?esc(pacienteNome(u.pacienteId)):'—'}</td><td>${tipo}${u.nota?`<br><span style="font-size:8.5px;color:#333">${esc(u.nota)}</span>`:''}</td></tr>`; }).join('')||'<tr><td colspan="7">Nenhum registro no período.</td></tr>'}</table>`;
  const corpo = String(html).replace(/^<h1>[\s\S]*?<\/h1>\s*<p class="sub">[\s\S]*?<\/p>/, '');
  return { html, corpo, usos, totalMin, nomeMes, ano };
}


/* ================= DOCUMENTOS PDF (prévia + impressão) ================= */
const DOC_EMPRESA = 'Clínica-Escola de Psicologia';
const DOC_EMPRESA_SUB = 'Anhanguera · Sistema de Agendamento e Controle';
const DOC_TH = 'border:1px solid #333;background:#eee;padding:3px 5px;font-size:9px;font-weight:700;text-align:left;';
const DOC_TD = 'border:1px solid #333;padding:3px 5px;font-size:9px;vertical-align:top;word-break:break-word;';
const DOC_STATUS = { agendado:'Agendado', confirmado:'Confirmado', compareceu:'Compareceu', falta_justificada:'Falta justificada', desistiu:'Desistência', pendente:'Pendente', triagem:'Em triagem', vinculado:'Vinculado', sugerida:'Horário sugerido', recusada:'Recusada', aprovada:'Aprovada', cancelado:'Cancelado' };
let __docPDF = null;

function docStatus(s){ const k = String(s||'').toLowerCase(); return DOC_STATUS[k] || (s ? String(s) : '—'); }

function docAgora(){
  const d = new Date();
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function docCabecalho(titulo, subtitulo){
  return '<div style="border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;">'
    +   '<div><div style="font-size:13px;font-weight:bold;line-height:1.25;">' + DOC_EMPRESA + '</div>'
    +   '<div style="font-size:8.5px;color:#444;margin-top:1px;">' + DOC_EMPRESA_SUB + '</div></div>'
    +   '<div style="font-size:8px;color:#444;text-align:right;line-height:1.45;">Emitido em ' + docAgora() + '<br>Documento gerado pelo sistema</div>'
    + '</div>'
    + '<div style="font-size:14px;font-weight:bold;margin-top:9px;">' + esc(titulo) + '</div>'
    + (subtitulo ? '<div style="font-size:9px;color:#333;margin-top:2px;">' + esc(subtitulo) + '</div>' : '')
    + '</div>';
}

function docRodape(resumo){
  return '<div style="margin-top:12px;border-top:1px solid #999;padding-top:5px;font-size:8px;color:#555;display:flex;justify-content:space-between;gap:10px;">'
    + '<span>' + DOC_EMPRESA + ' · documento interno</span><span>' + esc(resumo||'') + '</span></div>';
}

function docTabela(colunas, linhas, vazio){
  const head = colunas.map(c => '<th style="' + DOC_TH + (c.w ? 'width:' + c.w + ';' : '') + '">' + esc(c.t) + '</th>').join('');
  const body = (linhas && linhas.length)
    ? linhas.map(l => '<tr>' + l.map(v => '<td style="' + DOC_TD + '">' + (v === '' || v == null ? '—' : esc(String(v))) + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="' + colunas.length + '" style="' + DOC_TD + 'text-align:center;padding:10px;">' + esc(vazio || 'Nenhum registro.') + '</td></tr>';
  return '<table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:6px;"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
}

function abrirPreviewPDF(titulo, corpo, arquivo){
  __docPDF = { titulo: titulo, html: corpo, arquivo: arquivo || 'documento.pdf' };
  openModal('<div class="flex flex-wrap items-center justify-between gap-2 mb-2">'
    + '<div><h3 class="font-black text-base flex items-center gap-2">' + icon('file-text','w-4 h-4') + ' ' + esc(titulo) + '</h3>'
    + '<p class="text-[11px] ink-faint font-bold">Prévia do documento · ' + esc(__docPDF.arquivo) + '</p></div>'
    + '<div class="flex gap-2"><button class="btn btn-ghost rounded-lg px-3 py-2 text-xs" data-action="closeModal">Fechar</button>'
    + '<button class="btn btn-primary rounded-lg px-3 py-2 text-xs" data-action="imprimirDocPDF">' + icon('printer','w-3.5 h-3.5') + ' Imprimir / Salvar PDF</button></div></div>'
    + '<div style="max-height:62vh;overflow:auto;background:#e2e8f0;padding:10px;border-radius:10px;">'
    + '<div style="background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:0 auto;padding:22px;">' + corpo + '</div></div>'
    + '<p class="text-[11px] ink-faint font-bold mt-2">Confira o documento acima. Na janela de impressão, escolha “Salvar como PDF” (ou imprimir) para concluir.</p>');
}

function imprimirDocPDF(){
  if(!__docPDF){ toast('Gere o documento antes de imprimir.','warn'); return; }
  const area = $('printArea');
  if(!area){ toast('Área de impressão indisponível.','err'); return; }
  area.innerHTML = __docPDF.html;
  const tituloAnterior = document.title;
  document.title = String(__docPDF.arquivo || 'documento').replace(/\.pdf$/i,'');
  const restaurar = function(){ document.title = tituloAnterior; window.removeEventListener('afterprint', restaurar); };
  window.addEventListener('afterprint', restaurar);
  setTimeout(restaurar, 60000);
  setTimeout(function(){
    try{ window.print(); }
    catch(e){ document.title = tituloAnterior; toast('Não foi possível abrir a janela de impressão.','err'); }
  }, 150);
}

function docAgendaPDF(lista, subtitulo){
  const cols = [{t:'Data',w:'12%'},{t:'Hora',w:'8%'},{t:'Paciente',w:'30%'},{t:'Terapeuta',w:'22%'},{t:'Consultório',w:'15%'},{t:'Status',w:'13%'}];
  const linhas = lista.map(a => [ fmtDate(a.data), a.hora || '—', pacienteNome(a.pacienteId) || '—', a.terapeutaId ? terapeutaNome(a.terapeutaId) : '—', a.salaId ? salaNome(a.salaId) : '—', docStatus(a.status) ]);
  const cont = {};
  lista.forEach(a => { const k = docStatus(a.status); cont[k] = (cont[k] || 0) + 1; });
  const resumoStatus = Object.keys(cont).sort().map(k => k + ': ' + cont[k]).join(' · ');
  return docCabecalho('Agenda de atendimentos', subtitulo)
    + '<p style="font-size:9px;margin:0 0 6px;"><b>' + lista.length + '</b> atendimento(s)' + (resumoStatus ? ' · ' + esc(resumoStatus) : '') + '</p>'
    + docTabela(cols, linhas, 'Nenhum atendimento no período.')
    + docRodape('Total: ' + lista.length + ' registro(s)');
}

function docPacientesPDF(lista, subtitulo, comResponsavel){
  const cols = comResponsavel
    ? [{t:'Idade',w:'5%'},{t:'Paciente',w:'20%'},{t:'Prontuário',w:'8%'},{t:'Telefone',w:'10%'},{t:'Terapeuta',w:'14%'},{t:'Dia/Hora',w:'9%'},{t:'Status',w:'8%'},{t:'Responsável',w:'26%'}]
    : [{t:'Idade',w:'6%'},{t:'Paciente',w:'28%'},{t:'Prontuário',w:'11%'},{t:'Telefone',w:'14%'},{t:'Terapeuta',w:'18%'},{t:'Dia/Hora',w:'13%'},{t:'Status',w:'10%'}];
  const linhas = lista.map(p => {
    const linha = [
      p.idade ? String(p.idade) : '—',
      p.nome || '—',
      p.prontuario || '—',
      p.telefone || '—',
      p.terapeutaId ? terapeutaNome(p.terapeutaId) : 'Em triagem',
      p.diaFix ? (p.diaFix + ' às ' + (p.horaFix || '')) : '—',
      docStatus(p.status)
    ];
    if(comResponsavel) linha.push(p.responsavel && p.responsavel.nome ? (p.responsavel.nome + (p.responsavel.telefone ? ' · ' + p.responsavel.telefone : '')) : '—');
    return linha;
  });
  return docCabecalho('Lista de pacientes', subtitulo)
    + docTabela(cols, linhas, 'Nenhum paciente encontrado.')
    + docRodape('Total: ' + lista.length + ' paciente(s)');
}

function exportPacientesPDFCompleto(){

  abrirPreviewPDF('Cadastro de pacientes', docPacientesPDF(lista, lista.length + ' paciente(s) · visão administrativa completa', true), 'pacientes_' + todayISO() + '.pdf');

  else if(session.view==='professor') html=renderProfessor();
  else if(session.view==='recepcao') html=renderRecepcao();
  else if(session.view==='chat') html=renderChat();
  else html=renderAdmin();
  app.innerHTML=html;
  if(window.lucide) lucide.createIcons();
  try{ const emh = localStorage.getItem('clinicaAuthUser') || (window.__CLINICA_AUTH && window.__CLINICA_AUTH.email) || ''; if(emh && typeof mostrarUsuarioLogado==='function'){ mostrarUsuarioLogado(emh); } }catch(e){}
  
  applyMasks();
  refreshTimerDisplay();
  if(session.view==='admin' && session.adminTab==='dashboard' && window.d3) setTimeout(renderCharts, 80);

  }

}

document.addEventListener('click', e=>{

/* ================= TIMER CONTROLES ================= */
function registrarCheckInTimer(){
  if(!timer.pacienteId) return;
  const hoje=todayISO();
  const cands=state.agendamentos.filter(a=>a.pacienteId===timer.pacienteId && a.data===hoje && a.status==='agendado' && (!timer.salaId || !a.salaId || a.salaId===timer.salaId));
  if(cands.length!==1) return;
  cands[0].status='compareceu';
  if(!save()) return;
  const nome=pacienteNome(timer.pacienteId);
  render();
  toast('Check-in registrado: '+nome+'.','ok');
}
function startTimer(){
  if(timer.running) return;
  if(timer.remaining<=0){
    const min=Number($('tm_dur').value||50);
    timer.total=min*60*1000; timer.remaining=timer.total;
    timer.pacienteId=$('tm_paciente').value||null; timer.salaId=$('tm_sala').value||null;
    registrarCheckInTimer();
  }
  timer.endTs=Date.now()+timer.remaining; timer.running=true;
  if(!timer.interval) timer.interval=setInterval(timerTick,250);
  refreshTimerDisplay(); saveTimer();
}
function pauseTimer(){ if(!timer.running)return; timer.remaining=Math.max(0,timer.endTs-Date.now()); timer.running=false; clearInterval(timer.interval); timer.interval=null; refreshTimerDisplay(); saveTimer(); }
function resetTimer(){ timer.running=false; clearInterval(timer.interval); timer.interval=null; timer.remaining=0; timer.total=0; timer.pacienteId=null; timer.salaId=null; refreshTimerDisplay(); saveTimer(); }

function preencheCadastroPaciente(p){

  set('fDataNasc',dn); set('fMae',p.nomeMae); set('fTel',p.telefone); set('fEmail',p.email); set('fPront',p.prontuario);
  const e=p.endereco||{};
  set('fLogradouro',e.logradouro); set('fNumero',e.numero); set('fComplemento',e.complemento); set('fBairro',e.bairro);
  set('fCep',e.cep); set('fCidade',e.cidade); set('fUf',e.uf);

  set('fRespNome',r.nome); set('fRespCpf',r.cpf); set('fRespTel',r.telefone); set('fRespEmail',r.email);

function cadGo(n){

  document.querySelectorAll('.cad-dot').forEach((el,i)=>el.classList.toggle('active', i+1<=n));

  const nx=$('cadNext'); if(nx) nx.style.display = n===6?'none':'';
  const fn=$('cadFinish'); if(fn) fn.style.display = n===6?'':'none';
  if(n===6) atualizaResumoCad();
  const card=$('modalCard'); if(card) card.scrollTop = 0;

function cadNext(){
  const v=id=>($(id)&&$(id).value.trim())||'';
  if(cadStep===1){ if(v('fNome').length<3){ toast('Informe o nome completo.','warn'); return; } if(!v('fSexo')){ toast('Selecione o sexo atribuído.','warn'); const sx=$('fSexo'); if(sx) sx.focus(); return; } cadGo(2); return; }
  if(cadStep===2){ if(!validaCpf(v('fCpf'))){ toast('Informe um CPF válido (com dígitos verificadores).','warn'); return; } const idade=idadeFromData($('fDataNasc').value); if(idade==null){ toast('Informe uma data de nascimento válida (DD/MM/AAAA).','warn'); return; } cadMinor = idade<18; cadGo(3); return; }
  if(cadStep===3){ if(v('fMae').length<3){ toast('Informe o nome completo da mãe.','warn'); return; } if(!validaTel(v('fTel'))){ toast('Informe um telefone/WhatsApp válido com DDD.','warn'); return; } if(!validaEmail(v('fEmail'))){ toast('Informe um e-mail válido ou deixe em branco.','warn'); return; } if(cadEditId){ cadGo(4); return; } abrirCepPopup(()=>cadGo(4)); return; }
  if(cadStep===4){ if(v('fLogradouro').length<3 || !v('fNumero') || v('fBairro').length<2 || onlyDigits(v('fCep')).length!==8 || v('fCidade').length<2 || v('fUf').length!==2){ toast('Preencha o endereço completo (logradouro, nº, bairro, CEP com 8 dígitos, cidade e UF).','warn'); return; } cadGo(cadMinor?5:6); return; }

  cadGo(cadStep+1);
}
function cadBack(){ if(cadStep<=1) return; if(cadStep===6) cadGo(cadMinor?5:4); else if(cadStep===5) cadGo(4); else cadGo(cadStep-1); }
function atualizaResumoCad(){
  const el=$('cadResumo'); if(!el) return;

  html+=`<p class="text-xs ink-faint mt-1">CPF ${esc(v('fCpf'))||'—'} · ${esc(v('fSexo'))||'—'}</p>`;
  html+=`<p class="text-xs ink-faint mt-1">${esc(v('fTel'))||'—'}${v('fEmail')?' · '+esc(v('fEmail')):''}</p>`;
  html+=`<p class="text-xs ink-faint mt-1">${esc(v('fLogradouro'))}, ${esc(v('fNumero'))}${v('fComplemento')?' · '+esc(v('fComplemento')):''} — ${esc(v('fBairro'))} · ${esc(v('fCep'))} · ${esc(v('fCidade'))}/${esc(v('fUf'))}</p>`;
  if(cadMinor) html+=`<p class="text-xs ink-faint mt-1"><b>Resp.:</b> ${esc(v('fRespNome'))} · ${esc(v('fRespTel'))} · CPF ${esc(v('fRespCpf'))||'—'}</p>`;

function submitCadastro(){
  const v=id=>($(id)&&$(id).value.trim())||'';
  const nome=v('fNome'), dataNasc=v('fDataNasc'), tel=v('fTel'), pront=v('fPront');
  const idade=idadeFromData(dataNasc);
  if(nome.length<3 || idade==null || !validaTel(tel)){ toast('Preencha nome completo, data de nascimento válida e telefone com DDD.','warn'); return; }
  const cpf=v('fCpf');
  if(!validaCpf(cpf)){ toast('CPF inválido. Confira o passo 2.','err'); cadGo(2); return; }
  let responsavel=null;
  if(cadMinor || idade<18){
    if(v('fRespNome').length<3 || !validaCpf(v('fRespCpf')) || !validaTel(v('fRespTel'))){ toast('Menor de idade: informe nome, CPF e telefone válidos do responsável.','err'); cadGo(5); return; }
    responsavel={nome:v('fRespNome'),telefone:v('fRespTel'),cpf:v('fRespCpf'),email:v('fRespEmail')};
  }
  const dup=state.pacientes.find(p=> p.id!==cadEditId && ((cpf && onlyDigits(p.cpf)===onlyDigits(cpf)) || (normalizaNome(p.nome)===normalizaNome(nome) && onlyDigits(p.telefone)===onlyDigits(tel))));
  if(dup){ toast('Já existe um cadastro com este CPF ou com este nome e telefone. Use a busca da Área do Paciente.','warn'); return; }
  const dados={nome,idade,dataNascimento:dataNasc,cpf,nomeSocial:v('fNomeSocial'),sexo:v('fSexo'),nomeMae:v('fMae'),email:v('fEmail'),endereco:{logradouro:v('fLogradouro'),numero:v('fNumero'),complemento:v('fComplemento'),bairro:v('fBairro'),cep:v('fCep'),cidade:v('fCidade'),uf:v('fUf')},prontuario:pront,telefone:tel,responsavel};
  if(cadEditId){
    const p=state.pacientes.find(x=>x.id===cadEditId);
    if(!p){ toast('Paciente não encontrado.','err'); closeModal(); render(); return; }
    Object.assign(p,dados);
    if(!save()) return;
    closeModal(); render(); toast('Cadastro do paciente atualizado.','ok'); return;
  }
  const p=Object.assign({id:uid(),terapeutaId:null,diaFix:null,horaFix:null,status:'triagem'},dados);
  state.pacientes.push(p);
  if(!save()){ state.pacientes.pop(); return; }
  const viaAdmin = cadCtx==='admin';
  if(viaAdmin){ session.view='admin'; session.adminTab='usuarios'; } else session.pacienteId=p.id;
  cadCtx='paciente';
  closeModal(); render();
  toast(viaAdmin ? 'Paciente cadastrado pelo Admin — na fila de triagem.' : 'Cadastro realizado — paciente na fila de triagem.','ok');
}

/* ===== Pop-up de CEP (mesmo comportamento do site) ===== */
let cepPopEl=null, cepCtl=null;
async function consultaCep(cep){
  if(cepCtl) cepCtl.abort();
  cepCtl = (typeof AbortController==='function') ? new AbortController() : null;
  const res = await fetch('https://viacep.com.br/ws/'+cep+'/json/', cepCtl?{signal:cepCtl.signal}:undefined);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const d = await res.json();
  if(!d || d.erro || !d.localidade) throw new Error('CEP_NAO_ENCONTRADO');
  return d;
}
function preencheEnderecoCep(d){
  const put=(id,val)=>{ const t=$(id); if(t && val) t.value=val; };
  put('fLogradouro', d.logradouro||'');
  put('fBairro', d.bairro||'');
  put('fCidade', d.localidade||'');
  put('fUf', (d.uf||'').toUpperCase());
}
function abrirCepPopup(aoFechar){
  if(cepPopEl) return;
  const anterior=document.activeElement;
  const overflowAntes=document.body.style.overflow;
  const el=document.createElement('div');
  el.className='cep-overlay'; el.id='cepPopup';
  el.innerHTML=`<div class="cep-modal" role="dialog" aria-modal="true" aria-labelledby="mCepTitulo">
    <div class="flex items-start gap-2.5 mb-3">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:var(--accent-soft);color:var(--accent)">${icon('map-pin','w-4 h-4')}</span>
      <div><h3 id="mCepTitulo" class="font-black text-base leading-tight" style="color:var(--accent)">Informe o CEP</h3>
      <p class="text-xs font-bold ink-soft">Buscamos rua, bairro e cidade para você.</p></div>
    </div>
    <label for="mCep" class="text-xs font-black ink-soft block mb-1">CEP *</label>
    <input id="mCep" class="glass-input rounded-lg px-3 py-2.5 text-sm font-bold w-full" placeholder="00000-000" inputmode="numeric" autocomplete="postal-code" maxlength="9"/>
    <p id="mCepMsg" class="text-xs font-bold mt-1.5"></p>
    <div class="flex gap-2 mt-3">
      <button type="button" id="mCepSkip" class="btn btn-ghost rounded-lg px-3 py-2.5 text-xs flex-1 justify-center">Preencher manualmente</button>
      <button type="button" id="mCepOk" class="btn btn-primary rounded-lg px-3 py-2.5 text-xs flex-1 justify-center">Buscar CEP</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  cepPopEl=el;
  document.body.style.overflow='hidden';
  if(window.lucide) lucide.createIcons();
  const inp=el.querySelector('#mCep'), msg=el.querySelector('#mCepMsg'), btn=el.querySelector('#mCepOk');
  const cepAtual=$('fCep')?onlyDigits($('fCep').value):'';
  inp.value = cepAtual ? maskCep(cepAtual) : '';
  let encontrado=false, timer=null, buscando=false;
  const setMsg=(t,cls)=>{ msg.textContent=t||''; msg.className='text-xs font-bold mt-1.5 '+(cls?'is-'+cls:''); };
  const fechar=()=>{
    if(!cepPopEl) return;
    clearTimeout(timer);
    document.removeEventListener('keydown', onKey);
    el.remove(); cepPopEl=null;
    document.body.style.overflow=overflowAntes;
    try{ if(anterior && anterior.focus) anterior.focus(); }catch(e){}
    if(typeof aoFechar==='function') aoFechar();
    if(encontrado){ const num=$('fNumero'); if(num) num.focus(); }
  };
  const aplicar=(d)=>{
    preencheEnderecoCep(d);
    if($('fCep')) $('fCep').value=maskCep(onlyDigits(inp.value));
    encontrado=true; buscando=false;
    btn.textContent='Continuar';
    setMsg(`${d.logradouro||'CEP'}${d.bairro?' · '+d.bairro:''} — ${d.localidade}/${(d.uf||'').toUpperCase()}`,'ok');
  };
  const executar=async()=>{
    if(buscando) return;
    const cep=onlyDigits(inp.value);
    if(cep.length!==8){ setMsg('Digite os 8 dígitos do CEP.','err'); return; }
    buscando=true; btn.disabled=true; btn.textContent='Buscando…'; setMsg('');
    try{ aplicar(await consultaCep(cep)); }
    catch(e){
      if(!(e && e.name==='AbortError')) setMsg(e && e.message==='CEP_NAO_ENCONTRADO' ? 'CEP não encontrado. Confira o número.' : 'Não foi possível buscar agora. Preencha manualmente.','err');
    }finally{ buscando=false; btn.disabled=false; if(!encontrado) btn.textContent='Buscar CEP'; }
  };
  inp.addEventListener('input',()=>{
    inp.value=maskCep(inp.value);
    clearTimeout(timer);
    if(encontrado){ encontrado=false; btn.textContent='Buscar CEP'; setMsg(''); }
    if(onlyDigits(inp.value).length===8) timer=setTimeout(executar, 400);
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(e.isComposing || e.keyCode===229) return; if(encontrado) fechar(); else executar(); } });
  btn.addEventListener('click',()=>{ if(encontrado) fechar(); else executar(); });
  el.querySelector('#mCepSkip').addEventListener('click', fechar);
  el.addEventListener('click',e=>{ if(e.target===el) fechar(); });
  const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); fechar(); } };
  document.addEventListener('keydown', onKey);
  inp.focus();
  try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}
}

/* ===== Busca rápida de paciente (na própria tela) ===== */
function renderBuscaRapida(q){
  const box=$('buscaRapidaLista'); if(!box) return;
  if(!state.pacientes.length){
    box.innerHTML=`<div class="px-4 py-3 text-xs font-bold ink-faint">Nenhum paciente cadastrado ainda. Use "Novo Cadastro".</div>`;
    box.classList.remove('hidden'); return;
  }
  const nq=normalizar(q), dq=onlyDigits(q), dqc=onlyDigitsNorm(q);
  const tokens=nq?nq.split(/\s+/).filter(Boolean):[];
  const list=state.pacientes.filter(p=>{
    if(!tokens.length && dq.length<3) return true;
    const nn=normalizar(p.nome);
    const byName = tokens.length ? tokens.every(t=>nn.includes(t)) : false;
    const byPront = nq && normalizar(p.prontuario||'').includes(nq);
    const byTel = dq.length>=4 && onlyDigits(p.telefone).includes(dq);
    const byCpf = dqc.length>=5 && onlyDigitsNorm(p.cpf).includes(dqc);
    if(!tokens.length) return byTel || byCpf || byPront;
    return byName || byPront || byTel || byCpf;
  }).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR')).slice(0,12);
  if(!list.length){
    box.innerHTML=`<div class="px-4 py-3 text-xs font-bold ink-faint">Nada encontrado. Confira a grafia, CPF ou telefone.</div>`;
    box.classList.remove('hidden'); return;
  }
  box.innerHTML=list.map(p=>`<button type="button" class="w-full text-left px-4 py-2.5 border-b hairline last:border-0 hover:bg-white/70 transition" data-action="selecionarPacienteRapido" data-id="${esc(p.id)}"><span class="font-bold ink">${esc(p.nome)}</span>${Number(p.idade)<18?' '+menorPill():''}<span class="block text-[11px] ink-faint font-bold mt-0.5">${esc(String(p.idade??'—'))} anos · Prontuário ${esc(p.prontuario||'—')} · ${esc(p.telefone||'—')}</span>${statusPill(p.status)}</button>`).join('');
  box.classList.remove('hidden');
}

function confirmarSolicitacao(pacienteId){
  const data=$('solData').value, hora=$('solHora').value, msg=$('solMsg').value.trim();
  if(!data||!hora){ toast('Escolha dia e horário.','warn'); return; }
  if(data < todayISO()){ toast('A data não pode estar no passado.','warn'); return; }
  const p=state.pacientes.find(x=>x.id===pacienteId); if(!p){ toast('Paciente não encontrado.','err'); return; }
  if(!horasLivres(data, p.terapeutaId).includes(hora)){ toast('Horário indisponível (ocupado ou fora da disponibilidade).','err'); return; }
  if(conflitoPaciente(p.id,data,hora,null)){ toast('Você já tem atendimento neste horário.','warn'); return; }
  const dup=state.solicitacoes.find(s=>s.pacienteId===p.id && s.data===data && s.hora===hora && ['pendente','aprovada','sugerida'].includes(s.status));
  if(dup){ toast('Já existe uma solicitação para este horário.','warn'); return; }
  state.solicitacoes.push({id:uid(),pacienteId,terapeutaId:p.terapeutaId||null,data,hora,status:'pendente',mensagem:msg||'Solicitado pelo paciente.',salaId:null});
  if(!save()) return;
  closeModal(); render(); toast(p.terapeutaId?'Solicitação enviada para '+terapeutaNome(p.terapeutaId)+'.':'Solicitação enviada para a triagem do administrador.','ok');
}
function addUsoSala(alunoId, btnParam){
  const btn = btnParam || (event && event.target ? event.target.closest('button') : null);
  const isRecepcaoBtn = btn && (btn.getAttribute('data-recepcao') === '1' || (btn.dataset && btn.dataset.recepcao === '1'));
  const salaId=$('uso_sala')?$('uso_sala').value:'', data=$('uso_data')?$('uso_data').value:'', hora=$('uso_hora')?$('uso_hora').value:'', dur=Number($('uso_dur')?$('uso_dur').value:50), pacienteIdSel=($('uso_paciente')&&$('uso_paciente').value)?$('uso_paciente').value:null, responsavelSel=($('uso_responsavel')&&$('uso_responsavel').value)?$('uso_responsavel').value:null, nota=($('uso_nota')&&$('uso_nota').value||'').trim();
  const ctxAluno = (isRecepcaoBtn || alunoId === 'recepcao') ? 'recepcao' : alunoId;
  let pacienteId = pacienteIdSel;
  let alunoResp = (ctxAluno && ctxAluno !== 'recepcao') ? ctxAluno : null;
  if(ctxAluno === 'recepcao'){
    if(responsavelSel){
      alunoResp = responsavelSel;
      pacienteId = null;
    } else {
      toast('Na Recepção é obrigatório selecionar o responsável (Aluno/Professor/Terapeuta) para uso livre.','warn');
      return;
    }
  }

  if(!data || !validaHora(hora) || !Number.isFinite(dur) || dur<=0){ toast('Informe o dia, o horário e uma duração válida.','warn'); return; }

  const c=conflitoSalaIntervalo(salaId, data, hora, dur, null); if(c){ toast('Choque: '+c,'err'); return; }
  let aluno=(alunoId&&alunoId!=='recepcao')?alunoId:null;

      const u = (state.usuarios||[]).find(x=>x.terapeutaId===session.terapeutaId || x.id===session.terapeutaId);

  }
  if(!aluno){
    const ucur = (state.usuarios||[]).find(x=>x.tipo==='admin' || x.tipo==='professor' || x.tipo==='docente');
    if(ucur && ucur.terapeutaId) aluno = ucur.terapeutaId;

  if(!pacienteId && (!aluno || aluno==='recepcao')){
    if(session.terapeutaId && state.terapeutas.some(t=>t.id===session.terapeutaId)) aluno = session.terapeutaId;
  }
  if(aluno && state.terapeutas.some(t=>t.id===aluno)){

    const cp=conflitoPaciente(pacienteId, data, hora, null); if(cp){ toast('Choque: '+cp,'err'); return; } 
  }
  const cu = state.usoSalas.find(x=>x.salaId===salaId && x.data===data && intervaloSobrepoe(hora,dur,x.horaInicio, Number(x.duracaoMin)||50));
  if(cu){ toast('Choque com outro uso registrado neste consultório.','err'); return; }

  if(!save()) return;
  toast(pacienteId?'Uso de consultório registrado (vinculado a paciente).':(aluno && aluno!=='recepcao'?'Uso livre de consultório registrado e vinculado ao aluno/terapeuta/professor.':'Uso livre de consultório registrado.'),'ok'); render();
}

  state.agendamentos.forEach(a=>{ if(a.salaId===id) a.salaId=null; });
  state.usoSalas.forEach(u=>{ if(u.salaId===id) u.salaId=null; });
  state.solicitacoes.forEach(x=>{ if(x.salaId===id) x.salaId=null; });
  if(timer.salaId===id){ timer.salaId=null; saveTimer(); }

/* ================= MÁSCARAS DE ENTRADA ================= */
function maskTel(v){ v=v.replace(/\D/g,'').slice(0,11); if(v.length<=10) return v.replace(/(\d{2})(\d{1,4})?(\d{0,4})?/, (m,a,b,c)=>{ let r='('+a; if(b)r+=') '+b; if(c)r+='-'+c; return r; }); return v.replace(/(\d{2})(\d{5})(\d{0,4})/, (m,a,b,c)=> c? `(${a}) ${b}-${c}` : `(${a}) ${b}`); }
function maskCpf(v){ v=v.replace(/\D/g,'').slice(0,11); if(v.length>9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,'$1.$2.$3-$4'); if(v.length>6) return v.replace(/(\d{3})(\d{3})(\d{0,3})/,'$1.$2.$3'); if(v.length>3) return v.replace(/(\d{3})(\d{0,3})/,'$1.$2'); return v; }
function maskData(v){ v=v.replace(/\D/g,'').slice(0,8); if(v.length<=2) return v; if(v.length<=4) return v.replace(/(\d{2})(\d{0,2})/,'$1/$2'); return v.replace(/(\d{2})(\d{2})(\d{0,4})/,'$1/$2/$3'); }
function maskCep(v){ v=v.replace(/\D/g,'').slice(0,8); if(v.length<=5) return v; return v.replace(/(\d{5})(\d{0,3})/,'$1-$2'); }
function idadeFromData(d){ const m=(d||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m) return null; const nasc=new Date(+m[3], +m[2]-1, +m[1]); if(isNaN(nasc)) return null; const n=new Date(); let i=n.getFullYear()-nasc.getFullYear(); if(n.getMonth()<nasc.getMonth()||(n.getMonth()===nasc.getMonth()&&n.getDate()<nasc.getDate())) i--; return (i>=0&&i<120)?i:null; }
function applyMasks(root){ (root||document).querySelectorAll('[data-mask]').forEach(el=>{ if(el.__masked) return; el.__masked=true; el.addEventListener('input',()=>{ const f={telefone:maskTel,tel:maskTel,cpf:maskCpf,data:maskData,cep:maskCep}[el.dataset.mask]; if(!f) return; const pos=el.selectionStart; const before=el.value.length; el.value=f(el.value); const after=el.value.length; try{ el.setSelectionRange(pos+(after-before), pos+(after-before)); }catch(e){} if(el.dataset.mask==='data'){ const ev=new Event('input',{bubbles:true}); } }); }); }

function atualizaSolHora(){ const sel=$('solHora'); if(!sel) return; const data=$('solData').value; if(!data){ sel.innerHTML='<option value="">escolha o dia</option>'; return; } const p=solPacienteId?state.pacientes.find(x=>x.id===solPacienteId):null; const livres=horasLivres(data, p?p.terapeutaId:null); sel.innerHTML = livres.length ? livres.map(h=>`<option value="${h}">${h}</option>`).join('') : '<option value="">nenhum horário livre neste dia</option>'; }

/* ================= HORÁRIOS LIVRES (disponibilidade + ocupados) ================= */
let solPacienteId = null;
function horasLivres(data, terapeutaId, excluirSolicitacaoId){
  if(!data) return SLOTS.slice();
  const tt = terapeutaId ? state.terapeutas.find(x=>x.id===terapeutaId) : null;
  if(tt && tt.ativo===false) return [];
  let pool = SLOTS.slice();
  if(tt && tt.disponibilidade){ const wd=weekdayOf(data); if(Array.isArray(tt.disponibilidade[wd])) pool = tt.disponibilidade[wd].slice(); }
  const ocup = new Set();
  state.agendamentos.forEach(a=>{ if(a.data===data && a.status!=='desistiu' && (!terapeutaId || a.terapeutaId===terapeutaId)) ocup.add(a.hora); });
  state.solicitacoes.forEach(s=>{ if(s.data===data && s.id!==excluirSolicitacaoId && ['pendente','sugerida'].includes(s.status) && (!terapeutaId || s.terapeutaId===terapeutaId)) ocup.add(s.hora); });
  return pool.filter(h=>{
    if(ocup.has(h)) return false;
    if(!temSalaLivre(data, h, 30)) return false;
    if(terapeutaId && state.usoSalas.some(u=>u.data===data && u.alunoId===terapeutaId && intervaloSobrepoe(h, 30, u.horaInicio, Number(u.duracaoMin)||50))) return false;
    return true;
  });
}

let wizStep=1;
function wizGo(n){ wizStep=n; document.querySelectorAll('.wiz-step').forEach((el,i)=>el.classList.toggle('active', i+1===n)); document.querySelectorAll('.wiz-dot').forEach((el,i)=>el.classList.toggle('active', i+1<=n)); const b=$('wizBack'); if(b) b.style.visibility = n===1?'hidden':'visible'; const nx=$('wizNext'); if(nx) nx.style.display = n===3?'none':''; const fn=$('wizFinish'); if(fn) fn.style.display = n===3?'':'none'; if(n===3) atualizaResumo(); }
function wizNext(){ if(wizStep===1){ const nome=($('uNome')?$('uNome').value:'').trim(); if(!nome){ toast('Informe o nome.','warn'); return; } const tipoW = ($('uTipo')?$('uTipo').value:''); if(tipoW==='paciente'){ modalCadastro({contexto:'admin', nomeInicial:nome}); return; } wizGo(2); return; } if(wizStep===2){ const tipoW = ($('uTipo')?$('uTipo').value:''); if(tipoW==='professor'){ const t=$('uProfTurma'); const p=$('uProfPeriodo'); if(t && !t.value.trim()){ toast('Informe a turma.','warn'); return; } if(p && !p.value.trim()){ toast('Informe o período/semestre.','warn'); return; } } wizGo(3); return; } wizGo(wizStep+1); }
function wizBack(){ if(wizStep>1) wizGo(wizStep-1); }

function confirmarNovoUsuario(tipoFix){
  const nome=$('uNome').value.trim(); if(nome.length<3){ toast('Informe o nome completo.','warn'); return; }
  const tipo = tipoFix || ($('uTipo')?$('uTipo').value:'aluno');
  if(!['aluno','recepcao','admin','professor'].includes(tipo)){ toast('Tipo de usuário inválido.','err'); return; }
  const cod=($('uCod')?$('uCod').value:'').trim();
  let terapeutaId=null, extra={};
  if(tipo==='aluno'){
    const disp={}; [1,2,3,4,5].forEach(dd=>{ disp[dd]=SLOTS.filter(h=>{ const hh=parseInt(h,10); return hh>=8&&hh<18; }); });
    terapeutaId=uid();
    state.terapeutas.push({id:terapeutaId,nome,disponibilidade:disp,semestre:$('uSem')?$('uSem').value.trim():'',professor:$('uProf')?$('uProf').value.trim():'',turma:$('uTurma')?$('uTurma').value.trim():'',codigo:cod,ativo:true, tipo:'aluno'});
  }
  if(tipo==='professor'){
    const disp={}; [1,2,3,4,5].forEach(dd=>{ disp[dd]=SLOTS.filter(h=>{ const hh=parseInt(h,10); return hh>=8&&hh<18; }); });
    terapeutaId=uid();
    state.terapeutas.push({id:terapeutaId,nome,disponibilidade:disp,codigo:cod,ativo:true, tipo:'professor', turma:($('uProfTurma')?$('uProfTurma').value.trim():''), periodo:$('uProfPeriodo')?$('uProfPeriodo').value.trim():'', semestre:$('uProfPeriodo')?$('uProfPeriodo').value.trim():''});
  }
  if(tipo==='recepcao'){ extra={cargo:$('uCargo')?$('uCargo').value.trim():'',coordenador:$('uCoord')?$('uCoord').value.trim():'',setor:$('uSetor')?$('uSetor').value.trim():''}; }
  state.usuarios.push(Object.assign({id:uid(),nome,tipo,terapeutaId,codigo:cod,ativo:true}, extra));
  if(!save()) return;
  try{ if(window.ClinicaDB && ClinicaDB.auditLog){ ClinicaDB.auditLog('criar_usuario', nome, {tipo:tipo}).catch(()=>{}); } }catch(e){}
  closeModal(); render(); toast('Cadastro realizado: '+nome+' ('+tipo+').','ok');
}
function excluirUsuario(uid_){
  const u=state.usuarios.find(x=>x.id===uid_); if(!u)return;
  const emailAuth = u.authEmail || u.email || (u.extra && (u.extra.authEmail||u.extra.email));
  if(u.terapeutaId){ state.pacientes.forEach(p=>{ if(p.terapeutaId===u.terapeutaId){ p.terapeutaId=null; p.status='triagem'; } }); state.terapeutas=state.terapeutas.filter(tt=>tt.id!==u.terapeutaId); }
  state.usuarios=state.usuarios.filter(x=>x.id!==uid_);
  save(); render();
  if(emailAuth && window.ClinicaDB && typeof ClinicaDB.bloquearUsuarioAuth==='function'){ ClinicaDB.bloquearUsuarioAuth(emailAuth).catch(function(){}); }
  toast('Usuário excluído. Acesso ao painel bloqueado.','info');
}
function modalExcluirPaciente(id){
  const p=state.pacientes.find(x=>x.id===id); if(!p) return;
  const nAg=state.agendamentos.filter(a=>a.pacienteId===id).length;
  const nSol=state.solicitacoes.filter(s=>s.pacienteId===id).length;
  const nUso=state.usoSalas.filter(u=>u.pacienteId===id).length;
  const avisos=[];
  if(nAg) avisos.push(nAg+' atendimento(s)');

/* ================= SPLASH LOGIN (Supabase Auth + fallback) ================= */
function tentarLoginSupabase(usuario, senha){
  try{
    if(!window.ClinicaDB || !ClinicaDB.authSignIn) return Promise.resolve({ok:false});
    let email = usuario;
    if(email && email.indexOf('@') < 0){
      // Tenta mapear para email do Supabase Auth
      email = email + '@clinica-escola.local';
    }
    /* A SDK do Supabase é baixada da CDN no boot. Se a pessoa clicar em
       "Entrar" antes disso, o cliente ainda é null e o login seria recusado
       como "credenciais inválidas". Aqui esperamos apenas o CLIENTE existir
       (não a carga das tabelas), no máximo 4s. */
    function esperarCliente(restam){
      if(ClinicaDB.getClient && ClinicaDB.getClient()) return Promise.resolve();
      if(!restam) return Promise.resolve();
      return new Promise(function(r){ setTimeout(r, 100); }).then(function(){ return esperarCliente(restam-1); });
    }
    return esperarCliente(40).then(function(){ return ClinicaDB.authSignIn(email, senha); });
  }catch(e){ return Promise.resolve({ok:false}); }
}

function fazerLoginLocal(usuario, senha){
  const u=usuario.toLowerCase(), p=senha.toLowerCase();
  // Demo legado
  if(u==='admin' && p==='admin'){ return true; }
  // Valida contra tabela usuarios (fonte de verdade agora)
  try{
    if(state && Array.isArray(state.usuarios)){
      const found = state.usuarios.find(x=>x && x.ativo !== false);
      // Tenta casar por login/codigo/nome se existirem
      const match = state.usuarios.find(x=>{
        if(!x || x.ativo === false) return false;
        const cand = [x.login, x.usuario, x.email, x.codigo, x.nome].filter(Boolean).map(v=>String(v).trim().toLowerCase());
        const passCand = [x.senha, x.password, x.pass].filter(Boolean).map(v=>String(v).trim().toLowerCase());
        return cand.indexOf(u)>=0 && (passCand.indexOf(p)>=0 || (!passCand.length && (u==='admin' && p==='admin')));
      });
      if(match){ return true; }
      // Se houver usuarios mas nenhum com senha explicita, permite admin/admin apenas
    }
  }catch(e){}
  return false;
}

function mostrarUsuarioLogado(email){
  try{ if(typeof load==='function'){ try{ state = load(); }catch(e){} }
    const bar = $('authUserBar');
    const mail = $('authUserEmail');
    if(!bar || !mail) return;
    const emailRef = email || (window.__CLINICA_AUTH && window.__CLINICA_AUTH.email) || localStorage.getItem('clinicaAuthUser') || '';
    if(emailRef){
      let nomeExibir = emailRef;
      try{
        if(typeof load==='function'){ try{ state = load(); }catch(e){} }
        if(state && Array.isArray(state.usuarios)){
          const em = String(emailRef).trim().toLowerCase();
          const localPart = em.includes('@') ? em.split('@')[0] : em;
          // Procura match prioritario por authEmail
          let match = state.usuarios.find(u=>{
            if(!u) return false;
            const extra = u.extra || {};
            const nested = extra.extra || {};
            const authE = String(u.authEmail || extra.authEmail || extra.email || nested.authEmail || nested.email || '').trim().toLowerCase();
            if(authE && authE===em) return true;
            return false;
          });
          if(!match){
            match = state.usuarios.find(u=>{
              if(!u) return false;
              const candidatos = [
                u.email, u.login, u.usuario, u.codigo
              ].filter(Boolean).map(v=>String(v).trim().toLowerCase());
              return candidatos.indexOf(em)>=0 || candidatos.indexOf(localPart)>=0;
            });
          }
          // Fallback: qualquer usuario com nome preenchido e tipo preenchido
          if(!match){
            match = state.usuarios.find(u=> u && u.nome && String(u.nome).trim() && u.tipo && String(u.tipo).trim());
          }
          if(match){
            if(match.nome && String(match.nome).trim()){
              nomeExibir = String(match.nome).trim().split(' ')[0];
            }else if(match.codigo && String(match.codigo).trim()){
              nomeExibir = String(match.codigo).trim().split(' ')[0];
            }else if(localPart){
              nomeExibir = localPart;
            }
          }else{
            if(localPart){ nomeExibir = localPart; }
          }
        }else{
          const em = String(emailRef).trim().toLowerCase();
          const localPart = em.includes('@') ? em.split('@')[0] : em;
          if(localPart){ nomeExibir = localPart; }
        }
      }catch(e2){
        const em = String(emailRef).trim().toLowerCase();
        const localPart = em.includes('@') ? em.split('@')[0] : em;
        if(localPart){ nomeExibir = localPart; }
      }
      try{ mail.textContent = nomeExibir; }catch(e){}
      try{ mail.innerText = nomeExibir; }catch(e){}
      try{ const m2 = document.getElementById('authUserEmail'); if(m2){ m2.textContent = nomeExibir; m2.innerText = nomeExibir; } }catch(e){}
      bar.classList.remove('hidden');
      bar.classList.add('flex');
      try{ if(window.localStorage) localStorage.setItem('clinicaAuthDisplayName', nomeExibir); }catch(e){}
    }else{
      bar.classList.add('hidden');
      bar.classList.remove('flex');
    }
  }catch(e){}
}

function configurarSessaoPorUsuario(usuarioMatch, emailAuth){
  try{
    if(!usuarioMatch) return false;
    const tipo = (usuarioMatch.tipo||'').toString().toLowerCase().trim();
    if(!tipo){
      // Usuário pendente de vinculação - vai para view padrão mas mantém logado
      if(emailAuth) mostrarUsuarioLogado(emailAuth);
      return false;
    }
    if(tipo === 'admin'){
      session.view = 'admin';
      session.adminTab = 'usuarios';
      document.querySelectorAll('#viewSwitcher .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view==='admin'));
      if(emailAuth) mostrarUsuarioLogado(emailAuth);
      return true;
    }
    if(tipo === 'recepcao'){
      session.view = 'recepcao';
      document.querySelectorAll('#viewSwitcher .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view==='recepcao'));
      if(emailAuth) mostrarUsuarioLogado(emailAuth);
      return true;
    }
    if(tipo === 'professor' || tipo === 'docente'){
      session.view = 'professor';
      if(usuarioMatch.terapeutaId) session.terapeutaId = usuarioMatch.terapeutaId;
      document.querySelectorAll('#viewSwitcher .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view==='professor'));
      if(emailAuth) mostrarUsuarioLogado(emailAuth);
      return true;
    }
    if(tipo === 'aluno'){
      session.view = 'aluno';
      if(usuarioMatch.terapeutaId) session.terapeutaId = usuarioMatch.terapeutaId;
      document.querySelectorAll('#viewSwitcher .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view==='aluno'));
      if(emailAuth) mostrarUsuarioLogado(emailAuth);
      return true;
    }
  }catch(e){}
  if(emailAuth) mostrarUsuarioLogado(emailAuth);
  return false;
}

function encontrarUsuarioParaAuth(u, emailAuth){
  try{
    if(!state || !Array.isArray(state.usuarios)) return null;
    const ul = u.toLowerCase();
    const el = (emailAuth||'').toLowerCase();
    const localPart = el.split('@')[0];
    // 1) Prioridade: match por e-mail de acesso (authEmail) em qualquer registro
    if(el){
      for(let i=0;i<state.usuarios.length;i++){
        const x = state.usuarios[i];
        if(!x) continue;
        const extra = x.extra || {};
        const nested = extra.extra || {};
        const candEmails = [x.authEmail, x.email, extra.authEmail, extra.email, extra.userEmail, nested.authEmail, nested.email].filter(Boolean).map(v=>String(v).toLowerCase());
        if(candEmails.indexOf(el)>=0) return x;
      }
    }
    // 2) Fallback: match por login/usuario/codigo/nome
    for(let i=0;i<state.usuarios.length;i++){
      const x = state.usuarios[i];
      if(!x) continue;
      const candLogins = [x.login, x.usuario, x.codigo, x.nome].filter(Boolean).map(v=>String(v).toLowerCase());
      if(candLogins.indexOf(ul)>=0 || (localPart && candLogins.indexOf(localPart)>=0)) return x;
    }
  }catch(e){}
  return null;
}

function criarUsuarioPendenteAuth(u, emailAuth){
  try{
    if(!state) state = load();
    if(!Array.isArray(state.usuarios)) state.usuarios = [];
    const el = (emailAuth||'').toLowerCase();
    const localPart = el.split('@')[0] || u;
    // Evita duplicados
    const existente = encontrarUsuarioParaAuth(u, emailAuth);
    if(existente){
      // Atualiza para garantir visibilidade se necessário
      if(!existente.authEmail) existente.authEmail = emailAuth;
      if(!existente.email) existente.email = emailAuth;
      if(!existente.extra) existente.extra = {};
      if(!existente.extra.authEmail) existente.extra.authEmail = emailAuth;
      if(!existente.extra.email) existente.extra.email = emailAuth;
      try{ if(typeof save==='function'){ save(); } }catch(e){}
      try{ if(typeof render==='function'){ render(); } }catch(e){}
      return existente;
    }
    const novo = {
      id: uid(),
      nome: localPart || u,
      tipo: '',
      terapeutaId: null,
      codigo: localPart,
      ativo: true,
      authEmail: emailAuth,
      email: emailAuth,
      extra: { authEmail: emailAuth, email: emailAuth, authOrigin: true, criadoPorAuth: new Date().toISOString() }
    };
    state.usuarios.push(novo);
    try{ if(typeof save==='function'){ save(); } }catch(e){}
    try{ if(typeof render==='function'){ render(); } }catch(e){}
    try{ if(typeof sincronizarRemoto==='function'){ sincronizarRemoto(''); } }catch(e){}
    return novo;
  }catch(e){ return null; }
}

function saudacaoPorHorario(){
  try{
    const h = new Date().getHours();
    if(h >= 6 && h < 12) return 'Bom dia';
    if(h >= 12 && h < 18) return 'Boa tarde';
    return 'Boa noite';
  }catch(e){ return 'Bem-vindo(a)'; }
}

function diasDesde(dataIso){
  try{
    if(!dataIso) return 0;
    const hoje = new Date(todayISO()+'T00:00:00');
    const d = new Date(String(dataIso).slice(0,10)+'T00:00:00');
    if(isNaN(d.getTime())) return 0;
    const diff = Math.floor((hoje - d)/(1000*60*60*24));
    return diff;
  }catch(e){ return 0; }
}

function atualizarBadgeSolicitacoes(){
  try{
    const badge = document.getElementById('solicitacoesBadge');
    if(!badge) return;
         const st = (typeof state !== 'undefined' ? state : {}) || {};
    const lista = Array.isArray(st.solicitacoes)? st.solicitacoes : [];
    const pend = lista.filter(function(s){ return s && String(s.status||'').toLowerCase()==='pendente'; }).length;
    if(pend>0){ badge.textContent = pend>99?'99+':String(pend); badge.classList.remove('hidden'); badge.classList.add('flex'); }
    else { badge.classList.add('hidden'); badge.classList.remove('flex'); }
  }catch(e){}
}

function labelPerfil(tipo){
  const t = String(tipo||'').toLowerCase();
  if(t === 'admin') return 'Admin';
  if(t === 'recepcao' || t === 'recepção') return 'Recepção';
  if(t === 'professor') return 'Professor';
  if(t === 'aluno') return 'Aluno';
  return tipo ? String(tipo) : '';
}

async function doLogin(){
  const u=($('loginUser').value||'').trim(), p=($('loginPass').value||'').trim();
  if(!u || !p){ toast('Informe usuário e senha.','err'); return; }
  const btn=$('loginBtn'); if(btn){ btn.disabled=true; btn.style.opacity='.7'; }
  // Garante estado atualizado do Supabase antes de vincular o perfil
  // (refresh movido para após a autenticação, quando a sessão já existe)
  let emailTentativa = u;
  if(emailTentativa.indexOf('@') < 0){ emailTentativa = emailTentativa + '@clinica-escola.local'; }
  // Tenta Supabase Auth primeiro (caminho 2)
  tentarLoginSupabase(u,p).then(async function(resAuth){
    if(resAuth && resAuth.ok){
      try{ window.__CLINICA_AUTH = { email: emailTentativa, via: 'supabase' }; localStorage.setItem('clinicaAuthUser', emailTentativa); }catch(e){}
      // Recarrega dados agora autenticado (RLS libera 'usuarios')
      try{ if(window.ClinicaDB && ClinicaDB.carregar){ await ClinicaDB.carregar(); state = (typeof load==='function') ? load() : state; } }catch(e){}
      // Tenta vincular ao perfil de acesso na tabela usuarios
      let match = encontrarUsuarioParaAuth(u, emailTentativa);
      if(!match){
        // Cria registro pendente para que Admin/Recepção consigam designar o perfil
        match = criarUsuarioPendenteAuth(u, emailTentativa);
        /* Sem recarregar as 7 tabelas aqui: o usuário pendente já está no estado
           local e é enviado ao banco por save(). Essa recarga extra custava uma
           rajada de requisições e atrasava a entrada no painel. */
      }
      if(match){
        // Bloqueia acesso se o usuário estiver desativado
        if(match.ativo === false){
          try{ if(window.ClinicaDB && ClinicaDB.authSignOut){ ClinicaDB.authSignOut(); } }catch(e){}
          try{ localStorage.removeItem('clinicaAuthUser'); }catch(e){}
          toast('Usuário desativado. Acesso ao painel bloqueado.','err');
          if(btn){ btn.disabled=false; btn.style.opacity='1'; }
          return;
        }
        configurarSessaoPorUsuario(match, emailTentativa);
        try{ render(); }catch(e){}
        try{ if(typeof mostrarUsuarioLogado==='function'){ mostrarUsuarioLogado(emailTentativa); setTimeout(function(){ mostrarUsuarioLogado(emailTentativa); }, 250); } }catch(e){}
        const saud = saudacaoPorHorario();
        const nomeM = (match && match.nome && String(match.nome).trim()) ? String(match.nome).trim() : (emailTentativa.split('@')[0]);
        if(match && match.tipo){
          toast(saud + ', ' + nomeM + '!', 'ok');
        }else{
          toast(saud + ', ' + nomeM + '! Logado via Supabase Auth. Aguarde ou peça para Admin/Recepção definir seu perfil em Usuários.', 'info');
        }
      }else{
        try{ mostrarUsuarioLogado(emailTentativa); setTimeout(function(){ mostrarUsuarioLogado(emailTentativa); }, 200); }catch(e){}
        const saud = saudacaoPorHorario();
        const nomeM2 = (emailTentativa.split('@')[0]);
        toast(saud + ', ' + nomeM2 + '! Logado via Supabase Auth. Vincule este usuário na aba Admin > Usuários para definir permissões.', 'info');
      }
      const sp=$('splash'); if(sp){ sp.classList.add('splash-out'); setTimeout(()=>sp.classList.add('hidden'),750); }
      if(btn){ btn.disabled=false; btn.style.opacity='1'; }
      return;
    }
    // Projeto dormindo / sem resposta: avisa em vez de tentar senha local
    if(resAuth && resAuth.error && resAuth.error.code === 'TIMEOUT'){
      toast('O Supabase demorou para responder. Tente novamente em alguns segundos.','err');
      if(btn){ btn.disabled=false; btn.style.opacity='1'; }
      return;
    }
        // Mensagem específica para conta banida/desativada no Supabase Auth
    const msgAuth = (resAuth && resAuth.error && resAuth.error.message) ? String(resAuth.error.message) : '';
    if(/banned/i.test(msgAuth)){
      toast('Usuário desativado ou banido. Acesso ao painel bloqueado.','err');
    } else {
      // Sem fallback demo: autenticação real via Supabase Auth.
      toast('Usuário ou senha inválidos.','err');
    }
    if(btn){ btn.disabled=false; btn.style.opacity='1'; }
  }).catch(function(){
    toast('Usuário ou senha inválidos.','err');
    if(btn){ btn.disabled=false; btn.style.opacity='1'; }
  });
}
const __logo=$('splashLogo'); if(__logo) __logo.addEventListener('click', ()=>{ __logo.classList.add('hidden'); const __l=$('splashLogin'); if(__l){ __l.classList.remove('hidden'); setTimeout(()=>{ const __u=$('loginUser'); if(__u) __u.focus(); },120); } });

const __pw=$('loginPass'); if(__pw) __pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ if(e.isComposing || e.keyCode===229) return; doLogin(); } });
const __lv=$('loginVoltar'); if(__lv) __lv.addEventListener('click', ()=>{ const __sl=$('splashLogin'); if(__sl) __sl.classList.add('hidden'); const __lg=$('splashLogo'); if(__lg){ __lg.classList.remove('hidden'); __lg.style.animation='none'; void __lg.offsetWidth; __lg.style.animation=''; } });

render();
try{ if(window.ClinicaDB && ClinicaDB.carregar){ ClinicaDB.carregar().then(function(){ try{ state=load(); render(); }catch(e){} }); } }catch(e){}
try{ if(typeof atualizarBadgeSolicitacoes==='function') atualizarBadgeSolicitacoes(); }catch(e){}

/* Reconcilia o estado em memória com o cache (agora alimentado pelo Supabase)
   e redesenha. Usada pelo storage, pelo foco da janela e pelo tempo real. */
/* O selo "SYNC / LOCAL" foi removido do cabeçalho a pedido.
   A função permanece como no-op porque é chamada em vários pontos. */
function atualizarIndicadorSync(){}
function sincronizarRemoto(rotulo){
  const prevKey = JSON.stringify({p:state.pacientes?.length||0,a:state.agendamentos?.length||0,s:state.solicitacoes?.length||0,u:state.usoSalas?.length||0});
  state = load();
  ensureUsuarios();
  const nextKey = JSON.stringify({p:state.pacientes?.length||0,a:state.agendamentos?.length||0,s:state.solicitacoes?.length||0,u:state.usoSalas?.length||0});
  const modalOpen = $('modalRoot') && !$('modalRoot').classList.contains('hidden');
  try{ atualizarIndicadorSync(ClinicaDB && ClinicaDB.modo === 'supabase'); }catch(e){}
  if(modalOpen){
    if(prevKey!==nextKey){ try{ toast('Dados atualizados'+(rotulo||'.')+' Feche o formulário para ver.','info'); }catch(e){} }
    return;
  }
  render();
  try{ if(typeof atualizarBadgeSolicitacoes==='function') atualizarBadgeSolicitacoes(); }catch(e){}
  if(prevKey!==nextKey){ try{ toast('Dados atualizados'+(rotulo||'.'),'info'); }catch(e){} }
}
window.addEventListener('storage', e=>{ if(e.key!==STORAGE_KEY) return; try{ sincronizarRemoto(' em outra aba.'); }catch(err){} });
/* Ao voltar o foco para a janela, recarrega — mas no máximo 1x a cada 20s.
   Antes, cada foco disparava a leitura das 7 tabelas + render completo, o que
   deixava o painel lento logo após o login. */
let __ultimoFocoSync = 0;
window.addEventListener('focus', ()=>{
  try{
    if(Date.now() - __ultimoFocoSync < 20000) return;
    __ultimoFocoSync = Date.now();
    if(ClinicaDB && typeof ClinicaDB.atualizar==='function') ClinicaDB.atualizar();
    sincronizarRemoto('');
  }catch(e){}
});

/* ===== SUPABASE: boot assíncrono + sincronização em tempo real ===== */
ClinicaDB.onErro = msg => { try{ toast(msg,'err'); atualizarIndicadorSync(false); }catch(e){} };
ClinicaDB.onChange = () => { try{ sincronizarRemoto(''); atualizarIndicadorSync(true); }catch(e){} };
ClinicaDB.onSessaoExpirada = () => { try{ toast('Sessão expirada. Faça login novamente.','err'); if(typeof sairPainel==='function'){ sairPainel(); } else { try{ localStorage.removeItem('clinicaAuthUser'); }catch(e){} window.location.reload(); } }catch(e){} };
try{
  const au = localStorage.getItem('clinicaAuthUser');
  if(au){ window.__CLINICA_AUTH = { email: au }; mostrarUsuarioLogado(au); }
}catch(e){}
ClinicaDB.iniciar().then(r=>{ if(r && r.ok){ try{ sincronizarRemoto(''); atualizarIndicadorSync(true); }catch(e){} } else { atualizarIndicadorSync(false); } }).catch(()=>{ atualizarIndicadorSync(false); });
})();
